<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kirtan Purohit</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c0d0f'/%3E%3Cpath d='M7 6h7v8l6-8h8l-8 10 8 10h-8l-6-8v8H7z' fill='%23f1f2f0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Schibsted+Grotesk:wght@900&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=block" rel="stylesheet">
<style>
/* one motion language: arrive (.2,.8,.2,1), move (.7,0,.2,1), leave (.6,0,.85,.3) */
:root{--ink:#0c0d0f;--paper:#f1f2f0;--blue:#c9d8f7;--pink:#f2a7b6;--fg:#0c0d0f;--inv:#c9d8f7;--g:32px;
  --arrive:cubic-bezier(.2,.8,.2,1);--move:cubic-bezier(.7,0,.2,1);--leave:cubic-bezier(.6,0,.85,.3)}
*{box-sizing:border-box;margin:0;padding:0}
/* the page scrolls from the first frame. Sections below expect this overflow rule (they pin by hand, not with sticky) */
html,body{background:var(--blue);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;overflow-x:hidden;overflow-y:auto;height:auto}
body{-webkit-font-smoothing:antialiased}

/* the landing: a tall spacer. The wall itself is a fixed layer under #after, driven by scroll */
#hero{position:relative;height:190vh}
#stage{position:fixed;left:0;top:0;width:100%;height:100vh;height:100svh;overflow:hidden;z-index:0;background:var(--blue)}
#stage.kp-gone{visibility:hidden}
#wall{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:pan-y}
.rm-face{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none}
.kp-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* the scroll prompt: an ink pill, bottom centre, with a wheel whose dot rolls down. It fades as the wall starts to turn */
#scrollcue{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));z-index:2;pointer-events:none;
  opacity:0;transform:translate(-50%,12px);transition:opacity .48s var(--arrive),transform .48s var(--arrive)}
body.kp-in #scrollcue{opacity:1;transform:translate(-50%,0)}
body.kp-in.kp-going #scrollcue{opacity:0;transition-duration:.24s;transition-timing-function:var(--leave)}
#kpcue{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--paper);border:0;border-radius:999px;
  padding:16px 26px 16px 20px;font:800 21px/1 "Bricolage Grotesque",system-ui,sans-serif;cursor:pointer;pointer-events:auto;
  transition:transform .3s var(--arrive)}
#kpcue:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#kpcue.kp-off{pointer-events:none}
#kpcue .w{position:relative;display:block;width:16px;height:24px;border:2px solid currentColor;border-radius:8px}
#kpcue .w::after{content:"";position:absolute;left:50%;top:4px;width:4px;height:6px;margin-left:-2px;border-radius:2px;background:var(--pink);
  animation:kp-roll 1.4s var(--move) infinite}
@keyframes kp-roll{0%{transform:translateY(0);opacity:0}15%{opacity:1}60%{transform:translateY(9px);opacity:1}80%,100%{transform:translateY(9px);opacity:0}}

#after{position:relative;z-index:1}

#contact{position:fixed;top:18px;right:18px;z-index:10;display:flex;flex-direction:column;align-items:stretch;width:max-content}
/* Contact me: a sharp ink block, two lines. The name of the act, then the time where Kirtan is. Ink holds on every ground under it
   (light blue, pink, photos, the project list); a paper keyline only shows where the ground is dark, so it never sinks into navy.
   On hover a cobalt fill wipes up from the bottom edge; open, it stays cobalt and the message drops out beneath it as one piece. */
#cbtn{position:relative;display:grid;justify-items:start;gap:5px;min-width:196px;background:var(--ink);color:var(--paper);border:0;border-radius:0;
  box-shadow:0 0 0 1px rgba(241,242,240,.22);padding:13px 18px 12px 16px;cursor:pointer;text-align:left;overflow:hidden;
  transition:transform .16s var(--arrive)}
#cbtn::before{content:"";position:absolute;inset:0;background:#1c3bb0;transform:scaleY(0);transform-origin:50% 100%;transition:transform .5s var(--move)}
#cbtn>span{position:relative}
#cbtn .t{font:800 16px/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:.005em}
#cbtn .z{font:500 12.5px/1 "Bricolage Grotesque",system-ui,sans-serif;color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap}
#cbtn .z:empty{display:none}
#cbtn:active{transform:scale(.96)}
#cbtn[aria-expanded="true"]::before{transform:scaleY(1)}
@media (hover:hover){#cbtn:hover::before{transform:scaleY(1)}#kpcue:hover{transform:translateY(-2px)}}
#cbtn:focus-visible{outline:2px solid var(--paper);outline-offset:0;box-shadow:0 0 0 4px var(--ink)}
/* the message: the same ink block, hung from the button, revealed top down */
#cmsg{position:absolute;top:100%;left:0;right:0;background:var(--ink);color:var(--paper);box-shadow:0 0 0 1px rgba(241,242,240,.22);
  padding:13px 18px 15px 16px;border-top:1px solid rgba(241,242,240,.16);font:500 14.5px/1.4 "Bricolage Grotesque",system-ui,sans-serif;
  visibility:hidden;clip-path:inset(0 0 100% 0);transition:clip-path .36s var(--leave),visibility 0s linear .36s}
#cmsg.on{visibility:visible;clip-path:inset(0 0 0 0);transition:clip-path .5s var(--arrive),visibility 0s}
@media (prefers-reduced-motion: reduce){#cbtn,#cbtn::before,#cmsg,#cmsg.on{transition:none}}

/* the cursor: desktop with a fine pointer only (html.has-cursor). An ink dot that sits exactly on the pointer, and a ring that
   follows on a critically damped spring. Both carry a thin paper keyline, so they read on light blue, pink, navy and photos alike.
   Over [data-cursor] the ring fills and grows to hold a short word; on press it gives a little. */
html.has-cursor,html.has-cursor *{cursor:none!important}
html.has-cursor :is(input,textarea,select,[contenteditable="true"]){cursor:text!important}
#kc{position:fixed;left:0;top:0;width:0;height:0;z-index:2147483000;pointer-events:none;--kf:var(--ink);--kb:var(--paper)}
#kc[hidden]{display:none}
#kc.dark{--kf:var(--paper);--kb:var(--ink)}
#kc .kd,#kc .kr{position:absolute;left:0;top:0;will-change:transform}
#kc .kd i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--kf);box-shadow:0 0 0 1px var(--kb);
  transition:transform .2s var(--arrive),opacity .2s var(--arrive),background-color .2s,box-shadow .2s}
#kc .kr i{position:absolute;left:-20px;top:-20px;width:40px;height:40px;border-radius:50%;
  box-shadow:inset 0 0 0 1.5px var(--kf),inset 0 0 0 2.5px var(--kb),0 0 0 1px var(--kb);
  transition:transform .42s var(--arrive),opacity .24s var(--arrive),background-color .3s var(--arrive),box-shadow .2s}
#kc .kr b{position:absolute;left:0;top:0;transform:translate(-50%,-50%) translateY(6px);opacity:0;white-space:nowrap;color:var(--kb);
  font:800 15px/1 "Bricolage Grotesque",system-ui,sans-serif;transition:opacity .2s var(--arrive),transform .32s var(--arrive)}
#kc.link .kr i{transform:scale(1.3)}
#kc.lab .kr i{transform:scale(2.2);background:var(--kf);box-shadow:0 0 0 .5px var(--kb)}
#kc.lab .kr b{opacity:1;transform:translate(-50%,-50%);transition-delay:.06s}
#kc.lab .kd i{transform:scale(0);opacity:0}
#kc.down .kr i{transform:scale(.8)}
#kc.down.link .kr i{transform:scale(1.1)}
#kc.down.lab .kr i{transform:scale(2)}
#kc.off .kd i,#kc.off .kr i,#kc.off .kr b{opacity:0}
#kc.off .kr i{transform:scale(.4)}
@media (max-width:700px){:root{--g:18px}#contact{top:18px;right:18px}#cbtn{min-width:0;padding:11px 15px 10px 13px;gap:4px}#cbtn .t{font-size:15px}#cbtn .z{font-size:12px}#scrollcue{bottom:calc(24px + env(safe-area-inset-bottom))}#kpcue{font-size:18px;padding:13px 22px 13px 16px}}
@media (prefers-reduced-motion: reduce){#kpcue .w::after{animation:none;transform:translateY(4px)}#kpcue{transition:none}}
</style>

<body>
<section id="hero" aria-label="Kirtan Purohit">
  <div id="stage">
    <h1 class="kp-sr">Kirtan Purohit, creative producer and developer</h1>
    <canvas id="wall" aria-hidden="true"></canvas>
    <div id="scrollcue"><button id="kpcue" type="button" aria-label="Scroll down"><span class="w" aria-hidden="true"></span>Scroll</button></div>
  </div>
</section>
<div id="contact">
  <button id="cbtn" type="button" aria-expanded="false" aria-controls="cmsg" aria-label="Contact me"><span class="t">Contact me</span><span class="z" id="ctime" aria-hidden="true"></span></button>
  <p id="cmsg" aria-hidden="true">Email goes here once Kirtan confirms it.</p>
</div>

<script type="module">
/* The landing. A wall of slats: the front prints the name, the back prints the role.
   Scrolling turns the wall over in a left to right cascade, holds on the role, then #numbers rises over it
   and the wall is pushed up 22%, the same hand-off every chapter uses. Moving across the wall flips slats in a wave. */
import * as THREE from 'three';

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const C = { blue: '#c9d8f7', pink: '#f2a7b6', ink: '#0c0d0f', paper: '#f1f2f0', navy: '#0f2545', sky: '#7d9bf0', cobalt: '#1c3bb0' };

/* ---------- the contract with the sections below: the page is open from the start ---------- */
const PALETTE = [
  { bg: C.ink, a: C.paper, b: C.pink, hl: C.pink },
  { bg: C.blue, a: C.ink, b: C.cobalt, hl: C.cobalt },
  { bg: C.pink, a: C.ink, b: C.cobalt, hl: C.cobalt },
  { bg: C.navy, a: C.blue, b: C.pink, hl: C.pink },
];
window.KP = { palette: PALETTE, ink: C.ink, paper: C.paper, content: '../content/', open: true, final: true };
document.body.classList.add('open', 'final');
dispatchEvent(new Event('kp:open'));
dispatchEvent(new Event('kp:final'));

const $ = id => document.getElementById(id);
const cbtn = $('cbtn'), cmsg = $('cmsg');
/* Contact me: open and close the message; Escape or a click elsewhere closes it */
const setMsg = open => { cmsg.classList.toggle('on', open); cmsg.setAttribute('aria-hidden', String(!open)); cbtn.setAttribute('aria-expanded', String(open)); };
cbtn.addEventListener('click', () => setMsg(cbtn.getAttribute('aria-expanded') !== 'true'));
addEventListener('keydown', e => { if (e.key === 'Escape' && cbtn.getAttribute('aria-expanded') === 'true') { setMsg(false); cbtn.focus(); } });
addEventListener('pointerdown', e => { if (cbtn.getAttribute('aria-expanded') === 'true' && !$('contact').contains(e.target)) setMsg(false); });
/* the time in Ahmedabad, the minute it changes */
const ist = new Intl.DateTimeFormat('en-IN', { timeZone: 'Asia/Kolkata', hour: 'numeric', minute: '2-digit', hour12: true });
const tick = () => { $('ctime').textContent = ist.format(new Date()).replace(/\s?([ap])\.?m\.?$/i, (m, x) => ' ' + x.toLowerCase() + 'm') + ' in Ahmedabad'; setTimeout(tick, 60000 - Date.now() % 60000 + 50); };
tick();

const DISPLAY = '"Schibsted Grotesk"';
const DPR = Math.min(devicePixelRatio || 1, 2);
const stageEl = $('stage'), heroEl = $('hero'), canvas = $('wall');

/* ---------- scroll plan, in screens from the top ---------- */
/* 0 to FLIP[0]: the name. FLIP: the wall turns over, left to right. To HAND[0]: hold on the role.
   HAND: #numbers rises over the wall, which is pushed up 22% and then hidden. The landing is 190vh in all. */
/* After the hold, a second cascade (FLIP2) turns the wall to a plain light blue face, the numbers ground. The slats then
   dissolve into the flat blue stage (FADE), so when #numbers rises at HAND its top edge is blue on blue and never shows. */
const FLIP = [0.05, 0.7], FLIP2 = [1.05, 1.7], FADE = [1.72, 1.84], HAND = [1.86, 2.86], SPREAD = 2;

/* ---------- curves ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const rng = (x, a, b) => clamp((x - a) / (b - a));
const smooth = (a, b, x) => { const t = rng(x, a, b); return t * t * (3 - 2 * t); };
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = t => ((ax * t + bx) * t + cx) * t, Y = t => ((ay * t + by) * t + cy) * t, dX = t => (3 * ax * t + 2 * bx) * t + cx;
  return x => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x; for (let i = 0; i < 8; i++) { const d = dX(t); if (Math.abs(d) < 1e-6) break; t = clamp(t - (X(t) - x) / d); } return Y(t); };
}
const eMove = bezier(0.7, 0, 0.2, 1);

/* ---------- the two faces, drawn flat ---------- */
function makeCanvas(W, H) { const c = document.createElement('canvas'); c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); const g = c.getContext('2d'); g.scale(DPR, DPR); return [c, g]; }

/* the name: each line set to the full measure, flush both sides. On a phone the type is drawn taller than it is wide (SY) so it fills the screen */
function nameLayout(W, H) {
  const phone = W < 700, G = phone ? 18 : 32, SY = phone ? 1.85 : 1;
  const g = document.createElement('canvas').getContext('2d');
  const fit = word => { g.font = `900 100px ${DISPLAY}`; const m = g.measureText(word); return { size: (W - 2 * G) / (m.actualBoundingBoxRight + m.actualBoundingBoxLeft) * 100, word }; };
  const a = fit('KIRTAN'), b = fit('PUROHIT');
  g.font = `900 100px ${DISPLAY}`; const cap = g.measureText('H').actualBoundingBoxAscent / 100;
  let k = 1; const gapR = phone ? 0.16 : 0.1;
  const total = s => (a.size * cap * SY + a.size * gapR + b.size * cap * SY) * s;
  const room = H - (phone ? 240 : 200);
  if (total(1) > room) k = room / total(1);
  const blockH = total(k), top = H * (phone ? 0.46 : 0.47) - blockH / 2;
  return { G, k, cap, a, b, gapR, top, SY, blockH };
}

function drawFront(W, H) {
  const [c, g] = makeCanvas(W, H);
  g.fillStyle = C.blue; g.fillRect(0, 0, W, H);
  const L = nameLayout(W, H);
  g.fillStyle = C.ink; g.textBaseline = 'alphabetic';
  let y = L.top;
  for (const [i, line] of [L.a, L.b].entries()) {
    const s = line.size * L.k; g.font = `900 ${s}px ${DISPLAY}`;
    const m = g.measureText(line.word);
    y += s * L.cap * L.SY;
    g.save(); g.translate(L.G + m.actualBoundingBoxLeft, y); g.scale(1, L.SY); g.fillText(line.word, 0, 0); g.restore();
    if (i === 0) y += L.a.size * L.k * L.gapR;
  }
  return c;
}

/* the role, in his own words, set big in cobalt on light pink. It sits across the same band as the name,
   so a wave over either face lays strips of one into the other. */
const ROLE = { wide: ['Creative Producer', 'Developer'], phone: ['Creative Producer', 'Developer'] };
const LINE2 = 'Films on set. Software on screen.';
function drawBack(W, H) {
  const [c, g] = makeCanvas(W, H);
  const phone = W < 700, G = phone ? 18 : 32;
  g.fillStyle = C.pink; g.fillRect(0, 0, W, H);
  const lines = phone ? ROLE.phone : ROLE.wide;
  g.font = `900 100px ${DISPLAY}`;
  const wid = l => { const m = g.measureText(l); return m.actualBoundingBoxRight + m.actualBoundingBoxLeft; };
  const asc = g.measureText('d').actualBoundingBoxAscent / 100, desc = g.measureText('p').actualBoundingBoxDescent / 100;
  /* on a phone the role is drawn tall, like the name, so both faces carry the same weight */
  const STEP = 0.96, SY = phone ? 1.85 : 1;
  let size = (W - 2 * G) / Math.max(...lines.map(wid)) * 100;
  const blockOf = s => s * SY * (asc + (lines.length - 1) * STEP + desc);
  const room = H - (phone ? 230 : 190);
  if (blockOf(size) > room) size *= room / blockOf(size);
  const top = H * (phone ? 0.46 : 0.47) - blockOf(size) / 2;
  g.font = `900 ${size}px ${DISPLAY}`; g.fillStyle = C.cobalt; g.textBaseline = 'alphabetic';
  lines.forEach((l, i) => {
    const m = g.measureText(l);
    g.save(); g.translate(G + m.actualBoundingBoxLeft, top + size * SY * (asc + i * STEP)); g.scale(1, SY); g.fillText(l, 0, 0); g.restore();
  });

  /* the second line, small, bottom right, clear of the Scroll prompt */
  g.font = `800 ${phone ? 14 : 16}px "Bricolage Grotesque", system-ui, sans-serif`; g.fillStyle = C.ink; g.textAlign = 'right';
  g.fillText(LINE2, W - G, H - (phone ? 26 : 30));
  g.textAlign = 'left';
  return c;
}

/* ---------- three ---------- */
let renderer = null, scene, camera, amb, key;
let W = 0, H = 0, N = 0, pitch = 0, mesh = null, wallBack = null, frontTex = null, backTex = null;
let ang, off, vel, slatX, rmBack = null, rmFront = null, blueAttr = null;
const dummy = new THREE.Object3D();

function patch(mat, sign, uniforms, tag) {
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, uniforms);
    sh.vertexShader = 'attribute float aCol;\nattribute float aBlue;\nvarying float vBlue;\nuniform float uPitch, uN, uH;\n' + sh.vertexShader.replace('#include <uv_vertex>',
      `#include <uv_vertex>
      vBlue = aBlue;
      #ifdef USE_MAP
      vMapUv = vec2((aCol + 0.5 + ${sign.toFixed(1)} * position.x / uPitch) / uN, position.y / uH + 0.5);
      #endif`);
    /* the front of a slat that has gone past the pink face prints plain light blue instead of the name */
    if (sign > 0) sh.fragmentShader = 'varying float vBlue;\nuniform vec3 uBlueCol;\n' + sh.fragmentShader.replace('#include <map_fragment>',
      `#include <map_fragment>
      if (vBlue > 0.5) diffuseColor.rgb = uBlueCol;`);
  };
  mat.customProgramCacheKey = () => tag;   /* front and back must not share a program */
}

function initGL() {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(DPR);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(C.navy);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(16, 1, 1, 20000);
  /* soft studio light: a key from high left and an even fill, tuned so a slat facing you prints its true colour */
  amb = new THREE.AmbientLight(0xffffff, 1.32);
  key = new THREE.DirectionalLight(0xffffff, 2.05);
  key.castShadow = true;
  scene.add(amb, key, key.target);
}

function build() {
  W = innerWidth; H = stageEl.clientHeight || innerHeight;
  heroEl.style.height = Math.round((1 + HAND[0]) * H) + 'px';
  if (RM) { buildFlat(); return; }
  const phone = W < 700;
  N = phone ? Math.max(28, Math.round(W / 12)) : Math.min(200, Math.max(120, Math.round(W / 10)));
  pitch = W / N;
  renderer.setSize(W, H, false);

  if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); mesh.material.forEach(m => m.dispose()); }
  if (wallBack) { scene.remove(wallBack); wallBack.geometry.dispose(); wallBack.material.dispose(); }
  frontTex && frontTex.dispose(); backTex && backTex.dispose();

  const aniso = renderer.capabilities.getMaxAnisotropy();
  frontTex = new THREE.CanvasTexture(drawFront(W, H)); backTex = new THREE.CanvasTexture(drawBack(W, H));
  for (const t of [frontTex, backTex]) { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = aniso; }

  const slatW = pitch - Math.max(0.35, pitch * 0.022), depth = pitch * 0.2;
  const geo = new THREE.BoxGeometry(slatW, H, depth);
  const cols = new Float32Array(N); for (let i = 0; i < N; i++) cols[i] = i;
  geo.setAttribute('aCol', new THREE.InstancedBufferAttribute(cols, 1));
  blueAttr = new THREE.InstancedBufferAttribute(new Float32Array(N), 1); blueAttr.setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('aBlue', blueAttr);
  const uni = { uPitch: { value: pitch }, uN: { value: N }, uH: { value: H }, uBlueCol: { value: new THREE.Color(C.blue) } };
  const side = new THREE.MeshLambertMaterial({ color: C.paper });
  const front = new THREE.MeshLambertMaterial({ map: frontTex });
  const back = new THREE.MeshLambertMaterial({ map: backTex });
  patch(front, 1, uni, 'slat-front'); patch(back, -1, uni, 'slat-back');
  /* box groups: +x, -x, +y, -y, +z (front), -z (back) */
  mesh = new THREE.InstancedMesh(geo, [side, side, side, side, front, back], N);
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false;
  scene.add(mesh);

  /* the sky blue wall the slats hang in front of: in the gaps it reads as soft shadow */
  wallBack = new THREE.Mesh(new THREE.PlaneGeometry(W * 1.6, H * 1.6), new THREE.MeshLambertMaterial({ color: C.sky }));
  wallBack.position.z = -depth / 2 - pitch * 0.9; wallBack.receiveShadow = true;
  scene.add(wallBack);

  ang = new Float32Array(N); off = new Float32Array(N); vel = new Float32Array(N); slatX = new Float32Array(N);
  for (let i = 0; i < N; i++) slatX[i] = (i + 0.5) * pitch;

  /* camera fitted so the front plane of the wall fills the viewport exactly */
  camera.aspect = W / H;
  const dist = (H / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) + depth / 2;
  camera.position.set(0, 0, dist); camera.near = dist * 0.5; camera.far = dist * 2; camera.updateProjectionMatrix();

  const L = Math.max(W, H);
  key.position.set(-0.5 * L, 0.42 * L, 1.15 * L); key.target.position.set(0, 0, 0);
  const sc = key.shadow.camera; sc.left = -W * 0.75; sc.right = W * 0.75; sc.top = H * 0.75; sc.bottom = -H * 0.75; sc.near = 1; sc.far = L * 3;
  sc.updateProjectionMatrix();
  key.shadow.mapSize.set(phone ? 1024 : 2048, 2048);
  key.shadow.map && (key.shadow.map.dispose(), key.shadow.map = null);
  key.shadow.bias = -0.0004; key.shadow.normalBias = pitch * 0.06; key.shadow.radius = 3;
}

/* reduced motion: no wall, no wave. The name sits still and scrolling crossfades it to the role */
function buildFlat() {
  stageEl.querySelectorAll('.rm-face').forEach(e => e.remove());
  canvas.style.display = 'none';
  const f = drawFront(W, H), b = drawBack(W, H);
  f.className = b.className = 'rm-face'; f.setAttribute('aria-hidden', 'true'); b.setAttribute('aria-hidden', 'true');
  b.style.opacity = 0; b.style.transition = 'opacity .48s cubic-bezier(.7,0,.2,1)';
  stageEl.insertBefore(f, $('scrollcue')); stageEl.insertBefore(b, $('scrollcue'));
  rmBack = b; rmFront = f;
}

function place() {
  for (let i = 0; i < N; i++) {
    dummy.position.set(slatX[i] - W / 2, 0, 0);
    dummy.rotation.set(0, ang[i], 0);
    dummy.updateMatrix(); mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
}

/* ---------- input: the wave follows the pointer; touch gets a light wave until the page takes the gesture as a scroll ---------- */
const P = { x: null, inside: false, woke: false, startX: null, moved: -1e9 };
canvas.addEventListener('pointermove', e => {
  P.x = e.clientX; P.inside = true; P.moved = performance.now() / 1000;
  if (P.startX === null) P.startX = e.clientX;
  if (Math.abs(e.clientX - P.startX) > 60) P.woke = true;
});
canvas.addEventListener('pointerdown', e => { P.x = e.clientX; P.inside = true; if (e.pointerType !== 'mouse') P.woke = true; });
const out = e => { if (!e || e.pointerType !== 'mouse') P.inside = false; };
addEventListener('pointerup', out);
canvas.addEventListener('pointercancel', () => { P.inside = false; });
canvas.addEventListener('pointerleave', () => { P.inside = false; });
document.addEventListener('mouseleave', () => { P.inside = false; });
addEventListener('blur', () => { P.inside = false; });

/* ---------- scroll: the push and the hand-off follow the raw scroll so they stay locked to #numbers ---------- */
let gone = false, sm = null;
const cue = $('kpcue');
/* clicking the prompt scrolls to the end of the turn, so the wall plays its full cascade */
cue.addEventListener('click', () => scrollTo({ top: Math.round((FLIP[1] + 0.06) * H), behavior: RM ? 'auto' : 'smooth' }));
function onScroll() {
  const s = scrollY / H;
  if (s > 0.02) P.woke = true;
  const p = rng(s, HAND[0], HAND[1]);
  /* no push: by the hand-off the wall is flat light blue, the same ground #numbers rises on */
  gone = p >= 1;
  stageEl.classList.toggle('kp-gone', gone);
  document.body.classList.toggle('kp-going', s > HAND[0] - 0.04);
  document.body.classList.toggle('past', s > HAND[0] + 0.5);
  const midA = (FLIP[0] + FLIP[1]) / 2, midB = (FLIP2[0] + FLIP2[1]) / 2;
  if (RM && rmBack) { rmBack.style.opacity = s > midA && s < midB ? 1 : 0; rmFront.style.opacity = s > midA ? 0 : 1; }
  /* the prompt fades out over the first stretch of the turn */
  const cf = 1 - rng(s, 0.03, 0.16);
  cue.style.opacity = cf.toFixed(3); cue.classList.toggle('kp-off', cf < 0.2);
  /* the page ground under the stage follows the face, so a collapsing phone toolbar never shows a blue band under the pink */
  document.body.style.backgroundColor = s > midA && s < midB ? C.pink : '';
}
addEventListener('scroll', onScroll, { passive: true });

/* ---------- motion ---------- */
const PI = Math.PI;
/* the hand wave is quick with a small overshoot, as in the sketch */
const SP = { k: 120, z: 0.52 };
const now = () => performance.now() / 1000;
let last = now(), t0 = now(), frames = 0, settled = false, dirty = true, drawnSm = -1;

function step() {
  requestAnimationFrame(step);
  const t = now(), dt = Math.min(1 / 30, t - last); last = t;
  const s = scrollY / H;
  if (sm === null) sm = s;
  /* the turn follows a smoothed scroll, so a wheel notch reads as one stroke, not a stutter */
  sm += (s - sm) * (1 - Math.exp(-dt * 7));
  if (Math.abs(s - sm) < 1e-4) sm = s;
  /* once the wall is all light blue the slats dissolve into the flat blue stage behind them: same colour, no step */
  const fade = rng(sm, FADE[0], FADE[1]);
  canvas.style.opacity = fade > 0 ? (1 - fade).toFixed(3) : '';
  if (gone || fade >= 1) { settled = true; dirty = true; return; }

  const u = rng(sm, FLIP[0], FLIP[1]), u2 = rng(sm, FLIP2[0], FLIP2[1]);
  const R = W < 700 ? W * 0.17 : Math.max(110, W * 0.085);
  const idle = !P.woke && !P.inside && u === 0;
  const ix = (((t - t0) % 6.5) / 4.6) * (W * 1.4) - W * 0.2;   /* a slow swell crossing the wall, then a rest: says it moves */
  /* the wave answers movement: a pointer resting on the wall lets it close again, so the face you scrolled to reads whole */
  const rest = 1 - smooth(0.8, 1.6, t - P.moved);
  const c = 2 * SP.z * Math.sqrt(SP.k), sub = 3, h = dt / sub;
  let vmax = 0;
  for (let i = 0; i < N; i++) {
    const x = slatX[i], xi = x / W;
    /* the cascade: each slat turns on the move curve, starting a little after the one to its left */
    const t1 = PI * eMove(clamp(u * (1 + SPREAD) - xi * SPREAD));
    /* the second cascade: the same curve and stagger, pink over to plain light blue */
    const t2 = PI * eMove(clamp(u2 * (1 + SPREAD) - xi * SPREAD));
    const base = t1 + t2;
    blueAttr.array[i] = t2 > 0.001 ? 1 : 0;   /* swapped while the front faces away, so the swap never shows */
    let f = 0;
    if (P.inside && P.x !== null) f = rest * (1 - smooth(R * 0.32, R, Math.abs(x - P.x)));
    /* on either face, the wave turns a slat toward the other one */
    let target = u2 > 0 ? f * (PI - 2 * t2) : f * (PI - 2 * t1);
    if (idle) target = Math.max(target, 0.2 * Math.exp(-(((x - ix) / (W * 0.08)) ** 2)));
    let a = off[i], v = vel[i];
    for (let k = 0; k < sub; k++) { v += (-SP.k * (a - target) - c * v) * h; a += v * h; }
    off[i] = a; vel[i] = v; vmax = Math.max(vmax, Math.abs(v), Math.abs(a - target));
    ang[i] = base + a;
  }
  /* nothing moved: skip the draw, so the numbers chapter has the GPU to itself during the hand-off */
  if (dirty || idle || vmax > 1e-4 || sm !== drawnSm) {
    blueAttr.needsUpdate = true;
    place(); renderer.render(scene, camera); frames++;
    dirty = false; drawnSm = sm;
  }
  settled = Math.abs(s - sm) < 1e-4 && vmax < 0.01 && !idle;
}

/* test hooks for the headless check */
window.SLATS = { get frames() { return frames; }, get settled() { return settled; }, get N() { return N; }, get sm() { return sm; }, state: P, wake() { P.woke = true; } };

let rz = 0, builtW = 0;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (Math.abs(innerWidth - builtW) > 2 || Math.abs(stageEl.clientHeight - H) > 2) { builtW = innerWidth; build(); onScroll(); dirty = true; } }, 150); });

await Promise.all([document.fonts.load(`900 100px ${DISPLAY}`), document.fonts.load('800 16px "Bricolage Grotesque"'), document.fonts.load('500 15px "Bricolage Grotesque"')]);
if (!RM) initGL();
builtW = innerWidth;
build();
onScroll();
document.body.classList.add('kp-in');
if (!RM) requestAnimationFrame(step); else settled = true;
window.SLATS.ready = true;
</script>
<main id="after">
  <!-- numbers.js fills this: the motion-graphics numbers chapter -->
  <section id="numbers" aria-label="Numbers"></section>
  <!-- work.js fills this: all projects plus the project pages -->
  <section id="work" aria-label="Work"></section>
</main>
<div id="kc" aria-hidden="true" hidden><div class="kr"><i></i><b></b></div><div class="kd"><i></i></div></div>
<script>
/* the cursor. One rAF loop that sleeps when nothing moves; it only ever writes transforms. */
(() => {
  const fine = matchMedia('(hover: hover) and (pointer: fine)'), calm = matchMedia('(prefers-reduced-motion: reduce)');
  if (!fine.matches || calm.matches) return;   /* touch and reduced motion keep the system cursor */
  const root = document.documentElement, kc = document.getElementById('kc');
  const dot = kc.querySelector('.kd'), ring = kc.querySelector('.kr'), word = ring.querySelector('b');
  root.classList.add('has-cursor'); kc.hidden = false; kc.classList.add('off');
  const K = 520, C = 2 * Math.sqrt(K);   /* critically damped: it catches up without overshoot */
  let px = -100, py = -100, rx = -100, ry = -100, vx = 0, vy = 0, last = 0, raf = 0, seen = false, sampleAt = 0, lastEl = null;
  const lum = c => { const m = c.match(/[\d.]+/g); if (!m || (m[3] !== undefined && +m[3] < .5)) return -1; return (0.2126 * m[0] + 0.7152 * m[1] + 0.0722 * m[2]) / 255; };
  function read(el) {
    /* what sits under the pointer: a label, a plain link, a text field, and how dark the ground is */
    const field = el && el.closest('input,textarea,select,[contenteditable="true"]');
    const lab = el && el.closest('[data-cursor]');
    const link = el && el.closest('a[href],button,[role="button"],label,summary');
    let dark = false;
    for (let n = el; n && n.nodeType === 1; n = n.parentElement) {
      if (n === kc) continue;
      const L = lum(getComputedStyle(n).backgroundColor);
      if (L >= 0) { dark = L < 0.4; break; }
    }
    kc.classList.toggle('dark', dark);
    kc.classList.toggle('field', !!field);
    const text = lab && lab.getAttribute('data-cursor').trim();
    if (text) word.textContent = text;
    kc.classList.toggle('lab', !!text && !field);
    kc.classList.toggle('link', !text && !!link && !field);
    kc.classList.toggle('off', !!field || !seen);
  }
  function sample(t) {
    if (t - sampleAt < 90) return;
    sampleAt = t;
    const el = document.elementFromPoint(px, py);
    if (el !== lastEl) read(el);
    lastEl = el;
  }
  function frame(t) {
    raf = 0;
    const dt = Math.min(1 / 30, last ? (t - last) / 1000 : 1 / 60); last = t;
    for (let i = 0, h = dt / 2; i < 2; i++) { vx += (-K * (rx - px) - C * vx) * h; vy += (-K * (ry - py) - C * vy) * h; rx += vx * h; ry += vy * h; }
    dot.style.transform = `translate3d(${px}px,${py}px,0)`;
    ring.style.transform = `translate3d(${rx.toFixed(2)}px,${ry.toFixed(2)}px,0)`;
    sample(t);
    if (lastEl === null && seen) raf = requestAnimationFrame(frame);
    else if (Math.abs(rx - px) + Math.abs(ry - py) + Math.abs(vx) + Math.abs(vy) > 0.05) raf = requestAnimationFrame(frame);
    else { rx = px; ry = py; vx = vy = 0; last = 0; ring.style.transform = `translate3d(${px}px,${py}px,0)`; }
  }
  const wake = () => { if (!raf) raf = requestAnimationFrame(frame); };
  addEventListener('pointermove', e => {
    if (e.pointerType && e.pointerType !== 'mouse' && e.pointerType !== 'pen') return;
    px = e.clientX; py = e.clientY;
    if (!seen) { seen = true; rx = px; ry = py; sampleAt = 0; lastEl = null; read(document.elementFromPoint(px, py)); }
    wake();
  }, { passive: true });
  /* the ground can change under a still pointer: scroll and page changes re-read it */
  const reread = () => { if (seen) { lastEl = null; wake(); } };   /* the frame's sampler does the read, at most every 90ms */
  addEventListener('scroll', reread, { passive: true, capture: true });
  addEventListener('hashchange', () => setTimeout(reread, 60));
  addEventListener('pointerdown', () => kc.classList.add('down'));
  addEventListener('pointerup', () => kc.classList.remove('down'));
  document.addEventListener('mouseleave', () => { seen = false; kc.classList.add('off'); kc.classList.remove('down'); });
  document.addEventListener('mouseenter', () => { /* the next move places it */ });
  addEventListener('blur', () => { seen = false; kc.classList.add('off'); });
  /* a switch to touch or to reduced motion hands the system cursor back */
  const drop = () => { if (!fine.matches || calm.matches) { root.classList.remove('has-cursor'); kc.hidden = true; } else { root.classList.add('has-cursor'); kc.hidden = false; } };
  fine.addEventListener && fine.addEventListener('change', drop); calm.addEventListener && calm.addEventListener('change', drop);
  window.KC = { get state() { return { px, py, rx, ry, cls: kc.className }; } };
})();
</script>
