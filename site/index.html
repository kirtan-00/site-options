<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kirtan Purohit break through</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c0d0f'/%3E%3Cpath d='M7 6h7v8l6-8h8l-8 10 8 10h-8l-6-8v8H7z' fill='%23f1f2f0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=block" rel="stylesheet">
<style>
@property --p{syntax:'<number>';inherits:true;initial-value:0}
:root{--ink:#0c0d0f;--fg:#f1f2f0;--inv:#0c0d0f;--p:0;--g:20px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink);color:var(--fg);font-family:"Bricolage Grotesque",system-ui,sans-serif;overflow:hidden;height:100%}
body.final,html:has(body.final),body.open,html:has(body.open){overflow-x:hidden;overflow-y:auto;height:auto}
body.open #gl{touch-action:pan-y}
body.open #skip{display:none}
body.open #scrollcue{display:flex}
#aim.away{opacity:0}
body{transition:background-color .6s}
#hero{position:relative;height:100vh;height:100svh;overflow:hidden}
#after{position:relative;z-index:1}
body{-webkit-font-smoothing:antialiased}
#gl{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;cursor:none;opacity:0;transition:opacity .8s}
#gl.on{opacity:1}
body.final #gl{cursor:default;touch-action:pan-y}
#veil{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0}

/* the cursor carries the instruction, so nobody has to look for it */
/* one motion language: arrive (.2,.8,.2,1), move (.7,0,.2,1), leave (.6,0,.85,.3); 120 / 240 / 480 / 760 / 1100ms */
:root{--arrive:cubic-bezier(.2,.8,.2,1);--move:cubic-bezier(.7,0,.2,1);--leave:cubic-bezier(.6,0,.85,.3)}
#aim{position:fixed;left:0;top:0;z-index:3;pointer-events:none;color:var(--fg);will-change:transform;transition:opacity .48s var(--arrive)}
/* the ring only matters for crumple: a thin line that fills as you hold */
#aim i{display:none;position:absolute;left:-18px;top:-18px;width:36px;height:36px;border-radius:50%;
  background:conic-gradient(currentColor calc(var(--p) * 1turn),transparent 0);
  -webkit-mask:radial-gradient(circle,transparent 15px,#000 15.5px);mask:radial-gradient(circle,transparent 15px,#000 15.5px)}
#aim[data-how=crumple] i{display:block}
#aim i::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid color-mix(in srgb,currentColor 45%,transparent)}
#aim b{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:currentColor}
/* the cue is set type with a hand-drawn stroke under it, not a chip */
#aim span{position:absolute;left:24px;top:-10px;white-space:nowrap;font:500 15px/1 "Bricolage Grotesque",system-ui,sans-serif;color:var(--fg);padding-bottom:9px;-webkit-text-stroke:4px var(--inv);paint-order:stroke fill;transition:opacity .48s var(--arrive),transform .48s var(--arrive)}
#aim[data-how=crumple]:not(.touch) span{left:30px}
#aim span svg{position:absolute;left:0;bottom:0;width:100%;height:7px;overflow:visible}
#aim span path{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}
#aim.drawn span path{stroke-dashoffset:0;transition:stroke-dashoffset .48s var(--arrive)}
#aim.flip span{left:auto;right:24px}
#aim.flip[data-how=crumple] span{right:30px}
#aim.touch{left:50%;top:var(--aimy,58%)}
#aim.touch span{left:0;top:30px;transform:translateX(-50%)}
#aim.touch.at{left:0;top:0}
#aim.nolabel span{opacity:0}
#aim.hide,#aim.up{opacity:0;transition:opacity .12s var(--leave)}
#aim.hide span{transform:translateY(6px)}
#aim.touch.hide span{transform:translate(-50%,6px)}
/* on touch, the gesture plays as motion until the first try */
#aim.demo[data-how=shatter] b{animation:kp-pulse 1.3s cubic-bezier(.2,.7,.2,1) infinite}
#aim.demo[data-how=cut] b{animation:kp-slide 1.6s cubic-bezier(.65,0,.35,1) infinite}
#aim.demo[data-how=crumple] i{animation:kp-fill 1.8s cubic-bezier(.65,0,.35,1) infinite}
@keyframes kp-pulse{0%,55%,100%{transform:scale(1)}12%{transform:scale(2.6)}30%{transform:scale(1)}}
@keyframes kp-slide{0%,8%{transform:translateX(-60px)}55%,63%{transform:translateX(60px)}100%{transform:translateX(-60px)}}
@keyframes kp-fill{0%,8%{--p:0}70%,85%{--p:1}100%{--p:0}}

#dock{position:absolute;left:var(--g);right:var(--g);bottom:calc(14px + env(safe-area-inset-bottom));z-index:2;display:flex;align-items:center;justify-content:flex-start;gap:18px;pointer-events:none;color:var(--fg);font-weight:500;font-size:15px;transition:opacity .48s var(--arrive),transform .48s var(--arrive)}
#dock.swap{opacity:0;transform:translateY(8px);transition-duration:.24s;transition-timing-function:var(--leave)}
#count{font-variant-numeric:tabular-nums;white-space:nowrap}
#count b{font-weight:800}
#count .of{opacity:.5}
#line{width:min(200px,26vw);height:1.5px;background:color-mix(in srgb,var(--fg) 30%,transparent);position:relative}
#line i{position:absolute;left:0;top:0;bottom:0;background:var(--fg);width:0;transition:width .9s cubic-bezier(.7,0,.2,1)}
#skip{font:500 15px/1 "Bricolage Grotesque",system-ui,sans-serif;color:var(--fg);background:none;border:0;padding:14px 8px;text-decoration:underline;text-underline-offset:4px;cursor:pointer;pointer-events:auto}
#skip:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
#scrollcue{display:none;align-items:center;gap:10px;padding:7px 0;font-weight:800;font-size:16px}
#scrollcue i{width:1.5px;height:30px;background:currentColor;transform-origin:top;animation:drop 1.6s cubic-bezier(.7,0,.2,1) infinite}
@keyframes drop{0%{transform:scaleY(0)}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
body.final #skip{display:none}
body.final #scrollcue{display:flex}
@media (prefers-reduced-motion: reduce){#aim.demo b,#aim.demo i,#scrollcue i{animation:none!important}}

#contact{position:fixed;top:18px;right:18px;z-index:10;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#cbtn{background:var(--fg);color:var(--inv);border:0;border-radius:999px;padding:12px 20px;font:500 16px/1 "Bricolage Grotesque",system-ui,sans-serif;cursor:pointer}
#cbtn:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
#cmsg{background:var(--fg);color:var(--inv);padding:12px 16px;border-radius:12px;font:500 15px/1.3 "Bricolage Grotesque",system-ui,sans-serif;max-width:250px}
#cmsg[hidden]{display:none}
/* past the landing the sections change colour under it, so Contact me becomes a black pill with an off-white ring: it reads on every one */
#cbtn,#cmsg{transition:background-color .3s,color .3s,box-shadow .3s}
body.past #cbtn,body.past #cmsg{background:#0c0d0f;color:#f1f2f0;box-shadow:0 0 0 1.5px #f1f2f0}
body.past #cbtn:focus-visible{outline-color:#0c0d0f}
@media (max-width:700px){#dock{gap:12px}}
</style>

{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>

<canvas id="gl"></canvas>
<div id="veil"></div>

<div id="dock">
  <span id="count"></span><span id="line"><i id="linefill"></i></span>

</div>
</section>

  <button id="cbtn" type="button" aria-expanded="false" aria-controls="cmsg">Contact me</button>

</div>

<script type="module">

  tone(0, { how: 'shatter', layout: 'stack', cue: TOUCH ? 'Tap to shatter' : 'Click to shatter', head: [['Films', 1], ['on set.', 0], ['Software', 1], ['on screen.', 0]], lines: [] }),

const G = PHONE ? 20 : Math.round(Math.max(32, Math.min(56, innerWidth * 0.035)));   // the one left edge

/* the cue's underline draws on each time it appears or changes */

  const s = STAGES[i];

const COPY_TOP = 37;   // the centre of the Contact button

/* the name, baked into the breakable sheet */

  const capOf = f => { g.font = f; const mt = g.measureText('H'); return mt.actualBoundingBoxAscent || 0.7 * parseFloat(f.match(/(\d+(\.\d+)?)px/)[1]); };

  for (let wi = Math.max(0, stage - 1); wi <= Math.min(stage, walls.length - 1); wi++) for (const s of walls[wi].shards) {
    if (s.gone) continue; const m = s.mesh;
    if (s.live) {
      if (s.delay > 0) { s.delay -= st; continue; }
      s.v.y -= 9.5 * st; m.position.addScaledVector(s.v, st); m.rotation.x += s.w.x * st; m.rotation.y += s.w.y * st; m.rotation.z += s.w.z * st;
      if (m.position.y < -VH * 1.3 || m.position.z + walls[wi].z > camera.position.z - 0.5) { m.visible = false; s.gone = true; }
    } else if (s.crack && crackStart >= 0) {
      const u = clamp01((simT - crackStart - s.crack.at) / 0.12), a = s.crack.amt * u;
      m.rotation.set(s.rot.x * 0.06 * a, s.rot.y * 0.06 * a, s.rot.z * 0.02 * a); m.position.z = s.home.z + a * (0.01 + Math.abs(s.jit.z) * 0.04);
    }
  }
  cutFrame(st);
  if (cutFlash > 0) { cutFlash -= dt / 0.35; if (cutFlash <= 0) cutLine.visible = false; else cutLine.scale.y = UNIT * 0.004 * Math.ceil(cutFlash * 4) / 4; }
  crumpleFrame(dt, st);

  if (dolly) { const u = clamp01((now - dolly.t0) / dolly.dur); camZ = dolly.from + (dolly.to - dolly.from) * easeInOutQuart(u); if (u >= 1) dolly = null; }
  const px = RM ? 0 : mx * 0.2, py = RM ? 0 : my * 0.12;
  camX += (px - camX) * Math.min(1, dt * 2.5); camY += (py - camY) * Math.min(1, dt * 2.5);
  camera.position.set(camX, camY, camZ); camera.lookAt(camX * 0.4, camY * 0.4, camZ - D0);
  renderer.render(scene, camera); requestAnimationFrame(frame);
}

(async () => {
  await Promise.all([document.fonts.load('400 40px "Bowlby One"'), document.fonts.load('800 24px "Bricolage Grotesque"'), document.fonts.load('500 18px "Bricolage Grotesque"')]);
  buildWalls(); placeLight(0);
  canvas.classList.add('on');
  dollyTo(D0, 1.1);
  $('dock').classList.add('swap'); aimEl.classList.add('hide');
  if (RM) land(0, true);
  else { walls[0].copyMat.opacity = 0; after(0.75, () => land(0)); }
  after(RM ? 0.3 : 1.1, () => { busy = false; });
  window.__press = press; window.__move = move; window.__release = release; window.__fall = fallAway;
  window.__state = () => ({ stage, busy, how: STAGES[stage].how || 'final', hold: +hold.toFixed(2) });
  requestAnimationFrame(frame); window.__ready = true;
})();
</script>
