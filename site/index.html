<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kirtan Purohit</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c0d0f'/%3E%3Cpath d='M7 6h7v8l6-8h8l-8 10 8 10h-8l-6-8v8H7z' fill='%23f1f2f0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Schibsted+Grotesk:wght@900&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=block" rel="stylesheet">
<style>
/* one motion language: arrive (.2,.8,.2,1), move (.7,0,.2,1), leave (.6,0,.85,.3) */
:root{--ink:#0c0d0f;--paper:#f1f2f0;--blue:#c9d8f7;--pink:#f2a7b6;--fg:#0c0d0f;--inv:#c9d8f7;--g:32px;
  --arrive:cubic-bezier(.2,.8,.2,1);--move:cubic-bezier(.7,0,.2,1);--leave:cubic-bezier(.6,0,.85,.3)}
*{box-sizing:border-box;margin:0;padding:0}
/* the page scrolls from the first frame. Sections below expect this overflow rule (they pin by hand, not with sticky) */
html,body{background:var(--blue);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;overflow-x:hidden;overflow-y:auto;height:auto}
body{-webkit-font-smoothing:antialiased}

/* the landing: a tall spacer. The wall itself is a fixed layer under #after, driven by scroll */
#hero{position:relative;height:190vh}
#stage{position:fixed;left:0;top:0;width:100%;height:100vh;height:100svh;overflow:hidden;z-index:0;background:var(--blue)}
#stage.kp-gone{visibility:hidden}
#wall{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:pan-y}
.rm-face{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none}
.kp-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* the scroll prompt: an ink pill, bottom centre, with a wheel whose dot rolls down. It fades as the wall starts to turn */
#scrollcue{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));z-index:2;pointer-events:none;
  opacity:0;transform:translate(-50%,12px);transition:opacity .48s var(--arrive),transform .48s var(--arrive)}
body.kp-in #scrollcue{opacity:1;transform:translate(-50%,0)}
body.kp-in.kp-going #scrollcue{opacity:0;transition-duration:.24s;transition-timing-function:var(--leave)}
#kpcue{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--paper);border:0;border-radius:999px;
  padding:16px 26px 16px 20px;font:800 21px/1 "Bricolage Grotesque",system-ui,sans-serif;cursor:pointer;pointer-events:auto;
  transition:transform .3s var(--arrive)}
#kpcue:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#kpcue.kp-off{pointer-events:none}
#kpcue .w{position:relative;display:block;width:16px;height:24px;border:2px solid currentColor;border-radius:8px}
#kpcue .w::after{content:"";position:absolute;left:50%;top:4px;width:4px;height:6px;margin-left:-2px;border-radius:2px;background:var(--pink);
  animation:kp-roll 1.4s var(--move) infinite}
@keyframes kp-roll{0%{transform:translateY(0);opacity:0}15%{opacity:1}60%{transform:translateY(9px);opacity:1}80%,100%{transform:translateY(9px);opacity:0}}

#after{position:relative;z-index:1}

/* Contact: three versions to compare, picked by ?contact=1|2|3 (default 1). All of it lives in #contact (z-index 10, above the
   project page at 9). Closed, every version sits top right (or bottom right on a phone for 3), clear of the project page Back
   button at top left. Every class is ct- (shared) or c1-, c2-, c3- (one version). */
#contact{position:fixed;top:14px;right:22px;z-index:10;--navy:#0f2545;--sky:#7d9bf0}
.ct-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
#contact :is(button,a){-webkit-tap-highlight-color:transparent}
#contact button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
#contact :focus-visible{outline:2px solid currentColor;outline-offset:4px}
.ct-off{cursor:default;opacity:.42}
.ct-off small{display:inline-block;margin-left:.6em;font:500 13px/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:0;vertical-align:.25em}

/* ---------- the side panel (versions 1 and 2) ---------- */
.ct-scrim{position:fixed;inset:0;background:rgba(12,13,15,.34);opacity:0;visibility:hidden;transition:opacity .3s var(--leave),visibility 0s linear .3s}
.ct-panel{position:fixed;top:0;right:0;bottom:0;width:clamp(440px,40vw,680px);display:flex;flex-direction:column;background:var(--navy);color:var(--paper);
  padding:96px 48px 40px;overflow-y:auto;overscroll-behavior:contain;transform:translate3d(100%,0,0);visibility:hidden;
  transition:transform .34s var(--leave),visibility 0s linear .34s}
#contact.ct-on .ct-scrim{opacity:1;visibility:visible;transition:opacity .5s var(--arrive),visibility 0s}
#contact.ct-on .ct-panel{transform:none;visibility:visible;transition:transform .56s var(--arrive),visibility 0s}
/* Close sits exactly where the trigger was, so the hand does not travel */
.ct-close,.ct-close.ct-u{position:absolute;top:14px;right:22px;padding:12px 2px!important;font:800 20px/1 "Bricolage Grotesque",system-ui,sans-serif!important;color:var(--pink)!important}
/* one left edge for everything; the email and rows sit at the top, the time statement is anchored to the bottom */
.ct-body{display:flex;flex-direction:column;gap:clamp(36px,5.5vh,56px)}
.ct-head{display:flex;align-items:baseline;gap:14px;margin-bottom:10px;font:500 16px/1.3 "Bricolage Grotesque",system-ui,sans-serif;color:var(--blue)}
.ct-hint{display:grid;color:var(--pink);opacity:.55;transition:opacity .32s var(--arrive)}
.ct-hint>span{grid-area:1/1;white-space:nowrap;transition:opacity .24s var(--arrive),transform .34s var(--arrive)}
.ct-hint .b{opacity:0;transform:translate3d(0,.5em,0)}
.ct-mailwrap.copied .ct-hint{opacity:1}
.ct-mailwrap.copied .ct-hint .a{opacity:0;transform:translate3d(0,-.5em,0)}
.ct-mailwrap.copied .ct-hint .b{opacity:1;transform:none}
.ct-mail{display:block!important;max-width:100%;font:400 64px/1.02 "Bowlby One",system-ui,sans-serif!important;color:var(--pink)!important;white-space:nowrap;
  transition:transform .36s var(--arrive)}
.ct-mail:active{transform:translate3d(0,-1px,0) scale(.99)}
span.ct-mail{color:rgba(201,216,247,.45)!important}
.ct-mail.ct-off small{font-size:15px;vertical-align:.9em}
@media (hover:hover){.ct-mailwrap:hover .ct-hint{opacity:1}.ct-mailwrap:hover button.ct-mail{transform:translate3d(0,-4px,0)}}
.ct-mailwrap:focus-within .ct-hint{opacity:1}
button.ct-mail:focus-visible{outline:0!important;transform:translate3d(0,-4px,0)}
/* the channels: equal rows on thin rules, label on the left edge, handle on one column at the right */
.ct-links{list-style:none;border-top:1px solid rgba(201,216,247,.2)}
.ct-links li{border-bottom:1px solid rgba(201,216,247,.2)}
.ct-row{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:clamp(76px,10vh,92px);color:var(--paper);text-decoration:none}
.ct-l{position:relative;display:block;font:800 clamp(32px,2.9vw,44px)/1.1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em;
  transition:transform .36s var(--arrive)}
.ct-l::after{content:"";position:absolute;left:0;right:0;bottom:-.14em;height:2px;background:var(--pink);transform:scaleX(0);transform-origin:0 50%;
  transition:transform .4s var(--arrive)}
.ct-v{font:500 17px/1.2 "Bricolage Grotesque",system-ui,sans-serif;color:var(--blue);text-align:right;white-space:nowrap;opacity:.6;transition:opacity .32s var(--arrive)}
.ct-row.ct-off .ct-l{color:rgba(241,242,240,.42)}
.ct-row.ct-off .ct-v{opacity:.5}
@media (hover:hover){a.ct-row:hover .ct-l{transform:translate3d(8px,0,0)}a.ct-row:hover .ct-l::after{transform:scaleX(1)}a.ct-row:hover .ct-v{opacity:1}}
a.ct-row:focus-visible{outline:0!important}
a.ct-row:focus-visible .ct-l{transform:translate3d(8px,0,0)}a.ct-row:focus-visible .ct-l::after{transform:scaleX(1)}a.ct-row:focus-visible .ct-v{opacity:1}
a.ct-row:active .ct-l{transform:translate3d(4px,0,0)}
/* the live line: big, two sentences, the time in pink */
.ct-time{margin-top:auto;padding-top:48px;font:800 clamp(36px,3.3vw,52px)/1.08 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.015em;color:var(--paper);font-variant-numeric:tabular-nums}
.ct-time>span{display:block;text-wrap:balance}
.ct-time .t{color:var(--pink)}
.ct-time .m{color:var(--blue)}
/* the mode icon beside the time: flat, pink lead, sky second, light blue steam. A small idle motion, held still under reduced motion */
.ct-time .tw{white-space:nowrap}
.ct-ic{position:relative;display:inline-block;width:.9em;height:.9em;margin-left:.2em;vertical-align:-.1em;--p:#f2a7b6;--s:#7d9bf0;--b:#c9d8f7}
.ct-ic svg{display:block;width:100%;height:100%;overflow:visible}
.ct-ic .p{fill:var(--p)}.ct-ic .s{fill:var(--s)}.ct-ic .st{fill:none;stroke:var(--b);stroke-width:2.5;stroke-linecap:round}
.ct-ic .a{transform-box:fill-box;transform-origin:50% 50%}
.ct-ic::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 10px);padding:7px 12px;border-radius:999px;background:var(--pink);color:var(--ink);
  font:800 15px/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:0;white-space:nowrap;pointer-events:none;opacity:0;transform:translate3d(-50%,4px,0);transition:opacity .2s var(--leave),transform .2s var(--leave)}
@media (hover:hover){.ct-ic:hover::after{opacity:1;transform:translate3d(-50%,0,0);transition:opacity .28s var(--arrive),transform .32s var(--arrive)}}
@keyframes ct-tilt{from{transform:rotate(-9deg)}to{transform:rotate(7deg)}}
@keyframes ct-spin{to{transform:rotate(45deg)}}
@keyframes ct-lift{0%,18%{transform:translateY(0)}55%,70%{transform:translateY(-12%)}100%{transform:translateY(0)}}
@keyframes ct-steam{0%{transform:translateY(12%);opacity:0}30%{opacity:1}100%{transform:translateY(-22%);opacity:0}}
.ct-ic-night .a{animation:ct-tilt 1.2s cubic-bezier(.45,0,.55,1) infinite alternate}
.ct-ic-day .a,.ct-ic-sun .a{animation:ct-spin 2.4s linear infinite}
.ct-ic-workout .a{animation:ct-lift 1.6s cubic-bezier(.65,0,.35,1) infinite}
.ct-ic-chai .a{animation:ct-steam 2.2s cubic-bezier(.33,0,.4,1) infinite}.ct-ic-chai .a+.a{animation-delay:-1.1s}
@media (prefers-reduced-motion: reduce){.ct-ic .a{animation:none!important;opacity:1!important;transform:none!important}.ct-ic::after{transition:none}}
/* the panel content follows the panel in, a beat apart */
.ct-panel .ct-in{opacity:0;transform:translate3d(28px,0,0);transition:opacity .2s var(--leave),transform .2s var(--leave)}
#contact.ct-on .ct-panel .ct-in{opacity:1;transform:none;transition:opacity .5s var(--arrive),transform .6s var(--arrive);transition-delay:calc(120ms + var(--i,0) * 60ms)}

/* the drawn underline, shared by the word, Close and the panel links */
.ct-u{position:relative}
.ct-u::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:2px;background:currentColor;transform:scaleX(0);transform-origin:100% 50%;
  transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.ct-close.ct-u::after,.c1-word.ct-u::after{left:2px;right:2px;bottom:7px}
@media (hover:hover){.ct-u:hover::after{transform:scaleX(1);transform-origin:0 50%}}
.ct-u:focus-visible::after{transform:scaleX(1);transform-origin:0 50%}
.ct-u:focus-visible{outline:0!important}

/* ---------- 1: the bare word ---------- */
.c1-word{display:block;padding:12px 2px!important;font:800 20px/1 "Bricolage Grotesque",system-ui,sans-serif!important;color:var(--ink)!important;transition:color .24s var(--arrive)}
#contact.dark .c1-word{color:var(--pink)!important}
.c1-word:active{transform:scale(.96)}

/* ---------- 2: the slat strip ---------- */
#contact.v2{top:18px;right:18px}
.c2-strip{position:relative;display:block!important;width:143px;height:44px;background:var(--ink)!important;box-shadow:0 0 0 1px var(--ink);perspective:520px;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.c2-sl{position:absolute;top:0;width:11px;height:44px;transform-style:preserve-3d;transition:transform .46s var(--move)}
.c2-f{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--bg,var(--blue))}
.c2-f.b{transform:rotateY(180deg)}
.c2-t{position:absolute;top:0;width:143px;height:44px;display:flex;align-items:center;justify-content:center;white-space:nowrap;
  font:400 15px/1 "Bowlby One",system-ui,sans-serif;color:var(--fg,var(--ink));padding-top:1px}
.c2-strip:focus-visible{outline:2px solid var(--ink)!important;outline-offset:3px}
.c2-strip:active{transform:scale(.96)}

/* ---------- 3: the Say hi pill and its card ---------- */
#contact.v3{top:18px;right:18px}
.c3-pill{position:relative;z-index:2;display:block;height:48px;padding:0 22px!important;border-radius:24px;background:var(--pink)!important;color:var(--ink)!important;
  font:800 18px/48px "Bricolage Grotesque",system-ui,sans-serif!important;white-space:nowrap;
  box-shadow:0 1px 2px rgba(12,13,15,.14),0 8px 20px -10px rgba(12,13,15,.4);transition:transform .16s var(--arrive),box-shadow .3s var(--arrive)}
.c3-pill>span{display:block;transition:opacity .18s var(--arrive),transform .3s var(--arrive)}
.c3-pill .b{position:absolute;inset:0;text-align:center;opacity:0;transform:translateY(8px)}
#contact.ct-on .c3-pill{box-shadow:none}
#contact.ct-on .c3-pill .a{opacity:0;transform:translateY(-8px)}
#contact.ct-on .c3-pill .b{opacity:1;transform:none}
@media (hover:hover){.c3-pill:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(12,13,15,.16),0 12px 24px -10px rgba(12,13,15,.45)}}
.c3-pill:active{transform:scale(.96)}
.c3-pill:focus-visible{outline:2px solid var(--ink)!important;outline-offset:3px}
#contact.ct-on .c3-pill:focus-visible{outline-color:var(--pink)!important}
.c3-card{position:absolute;top:0;right:0;z-index:1;width:340px;padding:60px 8px 8px;border-radius:24px;background:var(--navy);color:var(--paper);
  box-shadow:0 2px 4px rgba(12,13,15,.16),0 24px 48px -20px rgba(12,13,15,.5);
  visibility:hidden;clip-path:inset(0 0 calc(100% - 48px) calc(100% - var(--pw,96px)) round 24px);
  transition:clip-path .3s var(--leave),visibility 0s linear .3s}
#contact.ct-on .c3-card{visibility:visible;clip-path:inset(0 0 0 0 round 24px);transition:clip-path .46s var(--arrive),visibility 0s}
.c3-rows{display:grid}
.c3-row{display:flex!important;align-items:center;justify-content:space-between;gap:12px;width:100%;height:60px;padding:0 18px!important;border-radius:16px;
  font:800 20px/1 "Bricolage Grotesque",system-ui,sans-serif!important;color:var(--paper)!important;text-decoration:none;transition:background-color .15s,color .15s}
.c3-row{position:relative}
.c3-row+.c3-row::before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:rgba(201,216,247,.14);transition:opacity .15s}
.c3-row small{font:500 13px/1 "Bricolage Grotesque",system-ui,sans-serif;color:var(--blue)}
.c3-row.ct-off{opacity:1;color:rgba(241,242,240,.42)!important}
.c3-row.ct-off small{margin:0;vertical-align:0}
@media (hover:hover){.c3-row:not(.ct-off):hover{background:var(--blue);color:var(--ink)!important}.c3-row:not(.ct-off):hover small{color:var(--ink)}
  .c3-row:not(.ct-off):hover::before,.c3-row:not(.ct-off):hover+.c3-row::before{opacity:0}}
.c3-row:focus-visible{outline:2px solid var(--pink)!important;outline-offset:-2px}
.c3-small{display:flex;gap:22px;padding:14px 18px 10px}
.c3-small :is(a,span){font:800 15px/1 "Bricolage Grotesque",system-ui,sans-serif;color:var(--pink);text-decoration:none;padding:6px 0}
.c3-small .ct-off{color:rgba(242,167,182,.5);opacity:1}
.c3-small .ct-off small{font-size:12px;margin-left:.45em;vertical-align:0}
.c3-card .ct-in{opacity:0;transform:translateY(-6px);transition:opacity .16s var(--leave),transform .16s var(--leave)}
#contact.ct-on .c3-card .ct-in{opacity:1;transform:none;transition:opacity .36s var(--arrive),transform .44s var(--arrive);transition-delay:calc(90ms + var(--i,0) * 40ms)}

@media (max-width:700px){
  #contact{top:14px;right:16px}
  #contact.v2{top:18px;right:18px}
  .ct-panel{width:100%;padding:92px 18px calc(32px + env(safe-area-inset-bottom))}
  .ct-close{right:16px}
  .ct-mail{font-size:40px!important}
  .ct-body{gap:32px}
  .ct-row{min-height:64px}
  .ct-l{font-size:30px}
  .ct-v{font-size:15px}
  .ct-time{font-size:32px;padding-top:36px}
  /* 3 on a phone: bottom right, in thumb reach, one row above the scroll prompt and the landing's small line. The card grows up out of it */
  #contact.v3{top:auto;bottom:calc(76px + env(safe-area-inset-bottom));right:16px}
  .c3-card{top:auto;bottom:0;width:calc(100vw - 32px);padding:8px 8px 60px;clip-path:inset(calc(100% - 48px) 0 0 calc(100% - var(--pw,96px)) round 24px)}
  .c3-card .ct-in{transform:translateY(6px)}
}
@media (prefers-reduced-motion: reduce){
  .ct-panel,#contact.ct-on .ct-panel{transform:none;opacity:0;transition:opacity .2s linear,visibility 0s linear .2s}
  #contact.ct-on .ct-panel{opacity:1;transition:opacity .2s linear,visibility 0s}
  .ct-panel .ct-in,#contact.ct-on .ct-panel .ct-in,.c3-card .ct-in,#contact.ct-on .c3-card .ct-in{transform:none;transition:opacity .2s linear;transition-delay:0s}
  .c2-sl{transition:none}
  .c3-card,#contact.ct-on .c3-card{clip-path:none;transition:opacity .2s linear,visibility 0s linear .2s;opacity:0}
  #contact.ct-on .c3-card{opacity:1;transition:opacity .2s linear,visibility 0s}
  .ct-u::after{transition:none}
  .ct-l,.ct-l::after,.ct-mail,.ct-hint>span{transition:none}
}

/* the cursor: desktop with a fine pointer only (html.has-cursor). An ink dot that sits exactly on the pointer, and a ring that
   follows on a critically damped spring. Both carry a thin paper keyline, so they read on light blue, pink, navy and photos alike.
   Over [data-cursor] the ring fills and grows to hold a short word; on press it gives a little. */
html.has-cursor,html.has-cursor *{cursor:none!important}
html.has-cursor :is(input,textarea,select,[contenteditable="true"]){cursor:text!important}
#kc{position:fixed;left:0;top:0;width:0;height:0;z-index:2147483000;pointer-events:none;--kf:var(--ink);--kb:var(--paper)}
#kc[hidden]{display:none}
#kc.dark{--kf:var(--paper);--kb:var(--ink)}
#kc .kd,#kc .kr{position:absolute;left:0;top:0;will-change:transform}
#kc .kd i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--kf);box-shadow:0 0 0 1px var(--kb);
  transition:transform .2s var(--arrive),opacity .2s var(--arrive),background-color .2s,box-shadow .2s}
#kc .kr i{position:absolute;left:-20px;top:-20px;width:40px;height:40px;border-radius:50%;
  box-shadow:inset 0 0 0 1.5px var(--kf),inset 0 0 0 2.5px var(--kb),0 0 0 1px var(--kb);
  transition:transform .42s var(--arrive),opacity .24s var(--arrive),background-color .3s var(--arrive),box-shadow .2s}
#kc .kr b{position:absolute;left:0;top:0;transform:translate(-50%,-50%) translateY(6px);opacity:0;white-space:nowrap;color:var(--kb);
  font:800 15px/1 "Bricolage Grotesque",system-ui,sans-serif;transition:opacity .2s var(--arrive),transform .32s var(--arrive)}
#kc.link .kr i{transform:scale(1.3)}
#kc.lab .kr i{transform:scale(2.2);background:var(--kf);box-shadow:0 0 0 .5px var(--kb)}
#kc.lab .kr b{opacity:1;transform:translate(-50%,-50%);transition-delay:.06s}
#kc.lab .kd i{transform:scale(0);opacity:0}
#kc.down .kr i{transform:scale(.8)}
#kc.down.link .kr i{transform:scale(1.1)}
#kc.down.lab .kr i{transform:scale(2)}
#kc.off .kd i,#kc.off .kr i,#kc.off .kr b{opacity:0}
#kc.off .kr i{transform:scale(.4)}
@media (max-width:700px){:root{--g:18px}#scrollcue{bottom:calc(24px + env(safe-area-inset-bottom))}#kpcue{font-size:18px;padding:13px 22px 13px 16px}}
@media (prefers-reduced-motion: reduce){#kpcue .w::after{animation:none;transform:translateY(4px)}#kpcue{transition:none}}
</style>

<body>
<section id="hero" aria-label="Kirtan Purohit">
  <div id="stage">
    <h1 class="kp-sr">Kirtan Purohit, creative producer and developer</h1>
    <canvas id="wall" aria-hidden="true"></canvas>
    <div id="scrollcue"><button id="kpcue" type="button" aria-label="Scroll down"><span class="w" aria-hidden="true"></span>Scroll</button></div>
  </div>
</section>
<div id="contact"></div>
<script>
/* Contact. One set of details, shared by all three versions. Fill these in and every version picks them up.
   whatsapp: the number with country code, digits only is fine ('919800000000'). instagram and linkedin: a handle or a full URL.
   Empty values show as a disabled row that says "to come"; nothing here is ever made up. */
const CONTACT = { email: '', whatsapp: '', instagram: 'kirtanheypurohit', linkedin: '' };

(() => {
  const root = document.getElementById('contact');
  const q = new URLSearchParams(location.search).get('contact');
  const V = ['1', '2', '3'].includes(q) ? +q : 1;
  root.classList.add('v' + V);
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const val = k => String(CONTACT[k] || '').trim();
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const WA = 'Hi Kirtan, saw your site. I have a project:';
  const HREF = {
    email: v => 'mailto:' + v,
    whatsapp: v => 'https://wa.me/' + v.replace(/\D/g, '') + '?text=' + encodeURIComponent(WA),
    instagram: v => /^https?:/i.test(v) ? v : 'https://www.instagram.com/' + v.replace(/^@/, '') + '/',
    linkedin: v => /^https?:/i.test(v) ? v : 'https://www.linkedin.com/in/' + v.replace(/^@/, '') + '/',
  };
  const NAME = { email: 'Email', whatsapp: 'WhatsApp', instagram: 'Instagram', linkedin: 'LinkedIn' };
  /* a link, or a tidy disabled stand-in that says the detail is to come */
  const link = (k, cls, i, label = NAME[k]) => {
    const v = val(k), st = i == null ? '' : ` style="--i:${i}"`;
    if (!v) return `<span class="${cls} ct-off" aria-disabled="true"${st}>${label}<small>to come</small></span>`;
    const ext = k === 'email' ? '' : ' target="_blank" rel="noopener"';
    return `<a class="${cls}" href="${esc(HREF[k](v))}"${ext}${st}>${label}</a>`;
  };
  async function copy(t) {
    try { await navigator.clipboard.writeText(t); return true; } catch (e) {
      const a = document.createElement('textarea'); a.value = t; a.setAttribute('readonly', ''); a.style.cssText = 'position:fixed;left:-9999px;opacity:0';
      document.body.appendChild(a); a.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} a.remove(); return ok;
    }
  }
  const ist = new Intl.DateTimeFormat('en-IN', { timeZone: 'Asia/Kolkata', hour: 'numeric', minute: '2-digit', hour12: true });
  const now = () => ist.format(new Date()).replace(/\s?([ap])\.?m\.?$/i, (m, x) => ' ' + x.toLowerCase() + 'm');

  /* ---------- open, close, focus: shared by all three ---------- */
  let trigger = null, box = null, lastFocus = null, onOpen = () => {}, onClose = () => {};
  const isOpen = () => root.classList.contains('ct-on');
  const focusables = () => [...box.querySelectorAll('a[href],button:not([disabled])')].concat(V === 3 ? [trigger] : []);
  function open() {
    if (isOpen()) return;
    lastFocus = document.activeElement;
    root.classList.add('ct-on'); trigger.setAttribute('aria-expanded', 'true'); box.removeAttribute('aria-hidden');
    onOpen();
    const first = box.querySelector('.ct-mail:not(.ct-off),a[href],button');
    requestAnimationFrame(() => first && first.focus({ preventScroll: true }));
  }
  function close(refocus = true) {
    if (!isOpen()) return;
    root.classList.remove('ct-on'); trigger.setAttribute('aria-expanded', 'false'); box.setAttribute('aria-hidden', 'true');
    onClose();
    if (refocus) (trigger.isConnected && getComputedStyle(trigger).visibility !== 'hidden' ? trigger : lastFocus || trigger).focus({ preventScroll: true });
  }
  addEventListener('keydown', e => {
    if (!isOpen()) return;
    if (e.key === 'Escape') { e.preventDefault(); close(); return; }
    if (e.key === 'Tab') {
      const f = focusables(); if (!f.length) return;
      const i = f.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && (i === -1 || i === f.length - 1)) { e.preventDefault(); f[0].focus(); }
    }
  }, true);
  addEventListener('pointerdown', e => { if (isOpen() && !box.contains(e.target) && !trigger.contains(e.target)) close(false); }, true);

  /* ---------- the side panel, for 1 and 2 ---------- */
  let mailBtn = null, timeEl = null, timeT = 0;
  /* the handle shown beside each channel: what was filled in, tidied, or "to come" */
  const SHOW = {
    whatsapp: v => '+' + v.replace(/\D/g, ''),
    instagram: v => '@' + v.replace(/^https?:\/\/(www\.)?instagram\.com\//i, '').replace(/^@/, '').replace(/\/.*$/, ''),
    linkedin: v => v.replace(/^https?:\/\/(www\.)?linkedin\.com\/(in\/)?/i, '').replace(/^@/, '').replace(/\/$/, ''),
  };
  const row = (k, i) => {
    const v = val(k), st = ` style="--i:${i}"`;
    if (!v) return `<li class="ct-in"${st}><span class="ct-row ct-off" aria-disabled="true"><span class="ct-l">${NAME[k]}</span><span class="ct-v">to come</span></span></li>`;
    return `<li class="ct-in"${st}><a class="ct-row" href="${esc(HREF[k](v))}" target="_blank" rel="noopener"><span class="ct-l">${NAME[k]}</span><span class="ct-v">${esc(SHOW[k](v))}</span></a></li>`;
  };
  /* Ahmedabad time and what it is there. Preview any moment with ?kpnow=2026-11-23T17:10 (read as Ahmedabad time) or
     window.__kpNow = a Date, a date string, or a function returning one */
  const KPQ = new URLSearchParams(location.search).get('kpnow');
  const asDate = x => { if (typeof x === 'function') x = x(); if (x instanceof Date) return x; if (typeof x === 'string') { const t = /[zZ]|[+-]\d\d:?\d\d$/.test(x) ? x : x + '+05:30'; const d = new Date(t); return isNaN(d) ? null : d; } return null; };
  const nowDate = () => (window.__kpNow != null && asDate(window.__kpNow)) || (KPQ && asDate(KPQ)) || new Date();
  const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kolkata', weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  /* mode icons, drawn flat in the panel palette. Class p = pink, s = sky, st = light blue stroke; .a is the part that moves.
     ?kpicon=ph swaps in Phosphor 2.1.1 (fill/duotone, MIT) for comparison */
  const ICONS = {
    night: '<g class="a"><path class="p" d="M11.6 3.01A9 9 0 1 0 20.88 13.45A7 7 0 0 1 11.6 3.01Z"/><circle class="s" cx="18.8" cy="4.4" r="1.9"/><circle class="s" cx="22" cy="9.4" r="1.25"/></g>',
    day: '<circle class="p" cx="12" cy="12" r="6.1"/><g class="a">' + [0, 45, 90, 135, 180, 225, 270, 315].map(r => `<rect class="s" x="10.5" y="0" width="3" height="4.2" rx="1.5" transform="rotate(${r} 12 12)"/>`).join('') + '</g>',
    workout: '<g class="a"><rect class="s" x="0" y="10.4" width="24" height="3.2" rx="1.6"/><rect class="p" x="3.4" y="3" width="4.6" height="18" rx="1.8"/><rect class="p" x="16" y="3" width="4.6" height="18" rx="1.8"/><rect class="p" x="0.6" y="6.6" width="2.4" height="10.8" rx="1.2"/><rect class="p" x="21" y="6.6" width="2.4" height="10.8" rx="1.2"/></g>',
    chai: '<path class="s" d="M4.6 9H19.4L17.75 20.95A1.6 1.6 0 0 1 16.17 22.3H7.83A1.6 1.6 0 0 1 6.25 20.95Z"/><path class="p" d="M6.15 12.4H17.85L16.95 19.55A1.1 1.1 0 0 1 15.86 20.5H8.14A1.1 1.1 0 0 1 7.05 19.55Z"/><path class="st a" d="M9.6 6.6c-1.3-1.2 1.3-2.2 0-3.9"/><path class="st a" d="M14.4 6.6c-1.3-1.2 1.3-2.2 0-3.9"/>',
  };
  ICONS.sun = ICONS.day;
  const PH = {
    night: '<g class="a"><path class="s" d="M227.89,147.89A96,96,0,1,1,108.11,28.11,96.09,96.09,0,0,0,227.89,147.89Z"/><path class="p" d="M233.54,142.23a8,8,0,0,0-8-2,88.08,88.08,0,0,1-109.8-109.8,8,8,0,0,0-10-10,104.84,104.84,0,0,0-52.91,37A104,104,0,0,0,136,224a103.09,103.09,0,0,0,62.52-20.88,104.84,104.84,0,0,0,37-52.91A8,8,0,0,0,233.54,142.23ZM188.9,190.34A88,88,0,0,1,65.66,67.11a89,89,0,0,1,31.4-26A106,106,0,0,0,96,56,104.11,104.11,0,0,0,200,160a106,106,0,0,0,14.92-1.06A89,89,0,0,1,188.9,190.34Z"/></g>',
    day: '<g class="a"><path class="s" d="M184,128a56,56,0,1,1-56-56A56,56,0,0,1,184,128Z"/><path class="p" d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm72,88a64,64,0,1,1-64-64A64.07,64.07,0,0,1,192,128Zm-16,0a48,48,0,1,0-48,48A48.05,48.05,0,0,0,176,128ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z"/></g>',
    workout: '<g class="a"><path class="s" d="M96,64V192a8,8,0,0,1-8,8H64a8,8,0,0,1-8-8V64a8,8,0,0,1,8-8H88A8,8,0,0,1,96,64Zm96-8H168a8,8,0,0,0-8,8V192a8,8,0,0,0,8,8h24a8,8,0,0,0,8-8V64A8,8,0,0,0,192,56Z"/><path class="p" d="M248,120h-8V88a16,16,0,0,0-16-16H208V64a16,16,0,0,0-16-16H168a16,16,0,0,0-16,16v56H104V64A16,16,0,0,0,88,48H64A16,16,0,0,0,48,64v8H32A16,16,0,0,0,16,88v32H8a8,8,0,0,0,0,16h8v32a16,16,0,0,0,16,16H48v8a16,16,0,0,0,16,16H88a16,16,0,0,0,16-16V136h48v56a16,16,0,0,0,16,16h24a16,16,0,0,0,16-16v-8h16a16,16,0,0,0,16-16V136h8a8,8,0,0,0,0-16ZM32,168V88H48v80Zm56,24H64V64H88V192Zm104,0H168V64h24V175.83c0,.06,0,.11,0,.17s0,.12,0,.17V192Zm32-24H208V88h16Z"/></g>',
    chai: '<path class="s" d="M208,88v48a88,88,0,0,1-51.3,80H83.3A88,88,0,0,1,32,136V88Z"/><path class="p" d="M248,120v8a40,40,0,0,1-37.51,39.91,96.59,96.59,0,0,1-27,40.09H208a8,8,0,0,1,0,16H32a8,8,0,0,1,0-16H56.54A96.3,96.3,0,0,1,24,136V88a8,8,0,0,1,8-8H208A40,40,0,0,1,248,120ZM200,96H40v40a80.27,80.27,0,0,0,45.12,72h69.76A80.27,80.27,0,0,0,200,136Zm32,24a24,24,0,0,0-16-22.62V136a95.78,95.78,0,0,1-1.2,15A24,24,0,0,0,232,128Z"/><path class="p a" d="M80,56V24a8,8,0,0,1,16,0V56a8,8,0,0,1-16,0Zm32,0V24a8,8,0,0,1,16,0V56a8,8,0,0,1-16,0Zm32,0V24a8,8,0,0,1,16,0V56a8,8,0,0,1-16,0Z"/>',
  };
  PH.sun = PH.day;
  const USE_PH = new URLSearchParams(location.search).get('kpicon') === 'ph';
  const LABEL = { night: 'Night', day: 'Day', workout: 'Workout', chai: 'Chai time', sun: 'Sunday' };
  const icon = k => `<span class="ct-ic ct-ic-${k}" role="img" aria-label="${LABEL[k]}" data-tip="${LABEL[k]}"><svg viewBox="${USE_PH ? '0 0 256 256' : '0 0 24 24'}" aria-hidden="true" focusable="false">${(USE_PH ? PH : ICONS)[k]}</svg></span>`;
  function status(d) {
    const p = Object.fromEntries(parts.formatToParts(d).map(x => [x.type, x.value])), h = +p.hour;
    const t = `<span class="t">${ist.format(d).replace(/\s?([ap])\.?m\.?$/i, (m, x) => '\u00a0' + x.toLowerCase() + 'm')}</span>`;
    if (p.weekday === 'Sun') return `<span>It's <span class="tw">${t}${icon('sun')}</span> on a Sunday in Ahmedabad.</span> <span class="m">Sunday mode.</span> <span class="m">I might reply even faster on Sundays.</span>`;
    const m = h === 10 ? 'workout' : h === 17 ? 'chai' : h >= 8 && h < 22 ? 'day' : 'night';
    return `<span>It's <span class="tw">${t}${icon(m)}</span> in Ahmedabad.</span>`;
  }
  function buildPanel() {
    const e = val('email');
    const mail = e
      ? `<div class="ct-mailwrap ct-in" style="--i:0">
           <p class="ct-head" aria-hidden="true"><span>Email</span><span class="ct-hint"><span class="a">Click to copy</span><span class="b">Copied</span></span></p>
           <button class="ct-mail" type="button" aria-label="Copy the email address ${esc(e)}">${esc(e)}</button>
         </div>`
      : `<span class="ct-mail ct-off ct-in" aria-disabled="true" style="--i:0">Email<small>to come</small></span>`;
    root.insertAdjacentHTML('beforeend', `<div class="ct-scrim" aria-hidden="true"></div>
      <aside class="ct-panel" id="ct-panel" role="dialog" aria-modal="true" aria-label="Contact Kirtan" aria-hidden="true">
        <button class="ct-close ct-u" type="button">Close</button>
        <div class="ct-body">${mail}
          <ul class="ct-links">${row('whatsapp', 1)}${row('instagram', 2)}${row('linkedin', 3)}</ul>
        </div>
        <p class="ct-time ct-in" style="--i:4"></p>
        <p class="ct-sr" aria-live="polite"></p>
      </aside>`);
    box = root.querySelector('.ct-panel'); timeEl = box.querySelector('.ct-time');
    box.querySelector('.ct-close').addEventListener('click', () => close());
    root.querySelector('.ct-scrim').addEventListener('click', () => close());
    mailBtn = box.querySelector('button.ct-mail');
    if (mailBtn) {
      let t = 0; const wrap = mailBtn.parentNode;
      mailBtn.addEventListener('click', async () => {
        if (!(await copy(e))) return;
        wrap.classList.add('copied'); box.querySelector('.ct-sr').textContent = 'Email copied';
        clearTimeout(t); t = setTimeout(() => { wrap.classList.remove('copied'); box.querySelector('.ct-sr').textContent = ''; }, 1600);
      });
    }
    const tick = () => { timeEl.innerHTML = status(nowDate()); timeT = setTimeout(tick, 60000 - Date.now() % 60000 + 50); };
    /* the address is set as big as the panel allows, one line, never past 64px (40px on a phone) */
    const fit = () => {
      if (!mailBtn) return;
      const cap = innerWidth <= 700 ? 40 : 64, g = (fit.g ||= document.createElement('canvas').getContext('2d'));
      g.font = `400 ${cap}px "Bowlby One"`;
      const cs = getComputedStyle(box), room = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), w = g.measureText(e).width;
      mailBtn.style.setProperty('font-size', (w > room ? Math.max(18, Math.floor(cap * room / w * 0.98)) : cap) + 'px', 'important');
    };
    onOpen = () => { clearTimeout(timeT); tick(); fit(); };
    onClose = () => clearTimeout(timeT);
    addEventListener('resize', () => isOpen() && fit());
  }

  /* ---------- 1: the bare word, coloured by the ground under it ---------- */
  if (V === 1) {
    root.insertAdjacentHTML('afterbegin', '<button class="c1-word ct-u" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="ct-panel">Contact</button>');
    trigger = root.querySelector('.c1-word');
    buildPanel();
    trigger.addEventListener('click', () => isOpen() ? close() : open());
    /* what is under the word: one elementsFromPoint, on scroll (one per frame at most), on resize and every 600ms as a backstop
       for things that move on their own (the project page flying in, its own scroll). The landing and the numbers are WebGL, so
       those are read from the scroll position: the landing faces are light blue or light pink (both light), and the numbers
       turn navy at the end of their second hand-off (HO[1] in numbers.js, 3.07 to 3.42 screens in), when the corner fills. */
    const lum = c => { const m = c.match(/[\d.]+/g); if (!m) return -1; const [r, g, b, a = 1] = m.map(Number); return a < 0.5 ? -1 : (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255; };
    /* a photo or film under the word: read the patch of it under the word from a 16 by 16 copy (object-fit is ignored, close enough) */
    const pc = document.createElement('canvas'); pc.width = pc.height = 16; const px = pc.getContext('2d', { willReadFrequently: true });
    function media(n, r) {
      try {
        const b = n.getBoundingClientRect(); if (!b.width || !b.height) return false;
        px.clearRect(0, 0, 16, 16); px.drawImage(n, 0, 0, 16, 16);
        const x0 = Math.max(0, Math.floor((r.left - b.left) / b.width * 16)), x1 = Math.min(16, Math.ceil((r.right - b.left) / b.width * 16));
        const y0 = Math.max(0, Math.floor((r.top - b.top) / b.height * 16)), y1 = Math.min(16, Math.ceil((r.bottom - b.top) / b.height * 16));
        if (x1 <= x0 || y1 <= y0) return false;
        const d = px.getImageData(x0, y0, x1 - x0, y1 - y0).data; let s = 0, k = 0;
        for (let i = 0; i < d.length; i += 4) { if (d[i + 3] < 128) continue; s += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]; k++; }
        return k ? s / k / 255 < 0.5 : false;
      } catch (e) { return true; }
    }
    function dark() {
      const g = document.documentElement.dataset.ground;   /* an open project page says which ground it is on */
      if (g) return g === 'dark';
      const r = trigger.getBoundingClientRect();
      for (const n of document.elementsFromPoint(r.left + r.width / 2, r.top + r.height / 2)) {
        if (root.contains(n)) continue;
        if (n.closest('#stage')) return false;
        if (n.closest('#numbers')) return -document.getElementById('numbers').getBoundingClientRect().top / innerHeight > 3.36;
        if (n.tagName === 'IMG' || n.tagName === 'VIDEO') return media(n, r);
        if (n.tagName === 'CANVAS') continue;
        const L = lum(getComputedStyle(n).backgroundColor);
        if (L >= 0) return L < 0.4;
      }
      return false;
    }
    let raf = 0;
    const read = () => { raf = 0; root.classList.toggle('dark', dark()); };
    const ask = () => { if (!raf) raf = requestAnimationFrame(read); };
    addEventListener('scroll', ask, { passive: true, capture: true });
    addEventListener('resize', ask); addEventListener('hashchange', () => setTimeout(ask, 60));
    setInterval(() => { if (!document.hidden) ask(); }, 600);
    new MutationObserver(ask).observe(document.documentElement, { attributes: true, attributeFilter: ['data-ground'] });
    ask();
  }

  /* ---------- 2: the slat strip ---------- */
  if (V === 2) {
    const N = 12, P = 12, SW = 143, e = val('email');
    const slats = Array.from({ length: N }, (_, i) =>
      `<span class="c2-sl" style="left:${i * P}px;transition-delay:${i * 40}ms"><span class="c2-f a"><span class="c2-t" style="left:${-i * P}px"></span></span><span class="c2-f b"><span class="c2-t" style="left:${-i * P}px"></span></span></span>`).join('');
    root.insertAdjacentHTML('afterbegin', `<button class="c2-strip" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="ct-panel"
      aria-label="${e ? 'Contact. Click to copy the email address, click again for more ways to reach Kirtan' : 'Contact'}">${slats}<span class="ct-sr" aria-live="polite"></span></button>`);
    trigger = root.querySelector('.c2-strip');
    buildPanel();
    const sl = [...trigger.querySelectorAll('.c2-sl')];
    const live = trigger.querySelector('.ct-sr');
    const LOOK = { name: ['Contact', 'var(--blue)', 'var(--ink)'], mail: [e || 'Say hello', 'var(--pink)', 'var(--ink)'], copied: ['Copied', 'var(--navy)', 'var(--pink)'] };
    const g = document.createElement('canvas').getContext('2d');
    const size = t => { g.font = '400 15px "Bowlby One"'; const w = g.measureText(t).width; return Math.min(15, Math.floor((SW - 14) / w * 15 * 10) / 10); };
    /* the strip always turns the same way, left to right, like the landing wall. The face turning away keeps what it showed,
       so a change of mind mid-turn just turns it back; anything else waits for the turn to land. */
    let ang = 0, face = 0, cur = 'name', prev = null, busyT = 0, pending = null, landAt = 0;
    const TURN = 460 + (N - 1) * 40;
    const paint = (f, st) => { const [t, bg, fg] = LOOK[st], fs = size(t) + 'px'; sl.forEach(s => { const el = s.children[f]; el.style.setProperty('--bg', bg); el.style.setProperty('--fg', fg); el.firstChild.textContent = t; el.firstChild.style.fontSize = fs; }); };
    const turn = d => { ang += d; landAt = Date.now() + (RM ? 0 : TURN); sl.forEach(s => { s.style.transform = `rotateY(${ang}deg)`; }); clearTimeout(busyT); busyT = setTimeout(() => { busyT = 0; if (pending) { const p = pending; pending = null; show(p); } }, RM ? 0 : TURN); };
    function show(st) {
      if (st === cur) { pending = null; return; }
      if (busyT && st === prev) { [cur, prev] = [prev, cur]; face = 1 - face; pending = null; turn(-180); return; }
      if (busyT) { pending = st; return; }
      paint(1 - face, st); face = 1 - face; prev = cur; cur = st; turn(180);
    }
    paint(0, 'name');
    let hover = false, armed = 0, copiedT = 0, pressT = 0, longFired = false;
    const rest = () => show(hover || trigger.matches(':focus-visible') ? 'mail' : 'name');
    trigger.addEventListener('pointerenter', ev => { if (ev.pointerType === 'mouse') { hover = true; if (cur !== 'copied') show('mail'); } });
    trigger.addEventListener('pointerleave', ev => { if (ev.pointerType === 'mouse') { hover = false; if (cur !== 'copied') show('name'); } });
    trigger.addEventListener('focus', () => { if (trigger.matches(':focus-visible') && cur === 'name') show('mail'); });
    trigger.addEventListener('blur', () => { if (!hover && cur !== 'copied') show('name'); });
    /* a long press goes straight to the panel */
    trigger.addEventListener('pointerdown', () => { longFired = false; clearTimeout(pressT); pressT = setTimeout(() => { longFired = true; open(); }, 520); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => trigger.addEventListener(t, () => clearTimeout(pressT)));
    trigger.addEventListener('contextmenu', ev => ev.preventDefault());
    trigger.addEventListener('click', async () => {
      if (longFired) { longFired = false; return; }
      if (isOpen()) { close(); return; }
      /* no address yet, or a second click: the panel with every way to reach him */
      if (!e || Date.now() < armed) { armed = 0; open(); return; }
      if (!(await copy(e))) { open(); return; }
      armed = Date.now() + 6000; live.textContent = 'Email copied. Click again for more.';
      show('copied'); clearTimeout(copiedT);
      /* "Copied" holds for 1.2s once it has landed; if a turn was already under way it lands one turn later */
      const lands = Math.max(0, landAt - Date.now()) + (pending === 'copied' ? (RM ? 0 : TURN) : 0);
      copiedT = setTimeout(() => { live.textContent = ''; rest(); }, lands + 1200);
    });
    onClose = (c => () => { c(); rest(); })(onClose);
  }

  /* ---------- 3: the Say hi pill and its card ---------- */
  if (V === 3) {
    const e = val('email');
    const copyRow = e ? `<button class="c3-row ct-in" type="button" style="--i:2" data-copy>Copy email<small></small></button>`
      : `<span class="c3-row ct-off ct-in" aria-disabled="true" style="--i:2">Copy email<small>to come</small></span>`;
    root.insertAdjacentHTML('afterbegin', `<button class="c3-pill" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="c3-card"><span class="a">Say hi</span><span class="b" aria-hidden="true">Close</span></button>
      <div class="c3-card" id="c3-card" role="dialog" aria-label="Say hi to Kirtan" aria-hidden="true">
        <div class="c3-rows">${link('whatsapp', 'c3-row ct-in', 0)}${link('email', 'c3-row ct-in', 1)}${copyRow}</div>
        <div class="c3-small ct-in" style="--i:3">${link('instagram', '')}${link('linkedin', '')}</div>
        <p class="ct-sr" aria-live="polite"></p>
      </div>`);
    trigger = root.querySelector('.c3-pill'); box = root.querySelector('.c3-card');
    /* the closed card is clipped to the pill exactly, so it unfolds out of it */
    const pw = () => root.style.setProperty('--pw', trigger.offsetWidth + 'px');
    pw(); document.fonts && document.fonts.ready.then(pw); addEventListener('resize', pw);
    trigger.addEventListener('click', () => isOpen() ? close() : open());
    const cb = box.querySelector('[data-copy]');
    if (cb) {
      let t = 0; const s = cb.querySelector('small');
      cb.addEventListener('click', async () => {
        if (!(await copy(e))) return;
        s.textContent = 'Copied'; box.querySelector('.ct-sr').textContent = 'Email copied';
        clearTimeout(t); t = setTimeout(() => { s.textContent = ''; box.querySelector('.ct-sr').textContent = ''; }, 1200);
      });
    }
  }
})();
</script>

<script type="module">
/* The landing. A wall of slats: the front prints the name, the back prints the role.
   Scrolling turns the wall over in a left to right cascade, holds on the role, then #numbers rises over it
   and the wall is pushed up 22%, the same hand-off every chapter uses. Moving across the wall flips slats in a wave. */
import * as THREE from 'three';

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const C = { blue: '#c9d8f7', pink: '#f2a7b6', ink: '#0c0d0f', paper: '#f1f2f0', navy: '#0f2545', sky: '#7d9bf0', cobalt: '#1c3bb0' };

/* ---------- the contract with the sections below: the page is open from the start ---------- */
const PALETTE = [
  { bg: C.ink, a: C.paper, b: C.pink, hl: C.pink },
  { bg: C.blue, a: C.ink, b: C.cobalt, hl: C.cobalt },
  { bg: C.pink, a: C.ink, b: C.cobalt, hl: C.cobalt },
  { bg: C.navy, a: C.blue, b: C.pink, hl: C.pink },
];
window.KP = { palette: PALETTE, ink: C.ink, paper: C.paper, content: '../content/', open: true, final: true };
document.body.classList.add('open', 'final');
dispatchEvent(new Event('kp:open'));
dispatchEvent(new Event('kp:final'));

const $ = id => document.getElementById(id);

const DISPLAY = '"Schibsted Grotesk"';
const DPR = Math.min(devicePixelRatio || 1, 2);
const stageEl = $('stage'), heroEl = $('hero'), canvas = $('wall');

/* ---------- scroll plan, in screens from the top ---------- */
/* 0 to FLIP[0]: the name. FLIP: the wall turns over, left to right. To HAND[0]: hold on the role.
   HAND: #numbers rises over the wall, which is pushed up 22% and then hidden. The landing is 190vh in all. */
/* After the hold, a second cascade (FLIP2) turns the wall to a plain light blue face, the numbers ground. The slats then
   dissolve into the flat blue stage (FADE), so when #numbers rises at HAND its top edge is blue on blue and never shows. */
const FLIP = [0.05, 0.7], FLIP2 = [1.05, 1.7], FADE = [1.72, 1.84], HAND = [1.86, 2.86], SPREAD = 2;

/* ---------- curves ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const rng = (x, a, b) => clamp((x - a) / (b - a));
const smooth = (a, b, x) => { const t = rng(x, a, b); return t * t * (3 - 2 * t); };
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = t => ((ax * t + bx) * t + cx) * t, Y = t => ((ay * t + by) * t + cy) * t, dX = t => (3 * ax * t + 2 * bx) * t + cx;
  return x => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x; for (let i = 0; i < 8; i++) { const d = dX(t); if (Math.abs(d) < 1e-6) break; t = clamp(t - (X(t) - x) / d); } return Y(t); };
}
const eMove = bezier(0.7, 0, 0.2, 1);

/* ---------- the two faces, drawn flat ---------- */
function makeCanvas(W, H) { const c = document.createElement('canvas'); c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); const g = c.getContext('2d'); g.scale(DPR, DPR); return [c, g]; }

/* the name: each line set to the full measure, flush both sides. On a phone the type is drawn taller than it is wide (SY) so it fills the screen */
function nameLayout(W, H) {
  const phone = W < 700, G = phone ? 18 : 32, SY = phone ? 1.85 : 1;
  const g = document.createElement('canvas').getContext('2d');
  const fit = word => { g.font = `900 100px ${DISPLAY}`; const m = g.measureText(word); return { size: (W - 2 * G) / (m.actualBoundingBoxRight + m.actualBoundingBoxLeft) * 100, word }; };
  const a = fit('KIRTAN'), b = fit('PUROHIT');
  g.font = `900 100px ${DISPLAY}`; const cap = g.measureText('H').actualBoundingBoxAscent / 100;
  let k = 1; const gapR = phone ? 0.16 : 0.1;
  const total = s => (a.size * cap * SY + a.size * gapR + b.size * cap * SY) * s;
  const room = H - (phone ? 240 : 200);
  if (total(1) > room) k = room / total(1);
  const blockH = total(k), top = H * (phone ? 0.46 : 0.47) - blockH / 2;
  return { G, k, cap, a, b, gapR, top, SY, blockH };
}

function drawFront(W, H) {
  const [c, g] = makeCanvas(W, H);
  g.fillStyle = C.blue; g.fillRect(0, 0, W, H);
  const L = nameLayout(W, H);
  g.fillStyle = C.ink; g.textBaseline = 'alphabetic';
  let y = L.top;
  for (const [i, line] of [L.a, L.b].entries()) {
    const s = line.size * L.k; g.font = `900 ${s}px ${DISPLAY}`;
    const m = g.measureText(line.word);
    y += s * L.cap * L.SY;
    g.save(); g.translate(L.G + m.actualBoundingBoxLeft, y); g.scale(1, L.SY); g.fillText(line.word, 0, 0); g.restore();
    if (i === 0) y += L.a.size * L.k * L.gapR;
  }
  return c;
}

/* the role, in his own words, set big in cobalt on light pink. It sits across the same band as the name,
   so a wave over either face lays strips of one into the other. */
const ROLE = { wide: ['Creative Producer', 'Developer'], phone: ['Creative Producer', 'Developer'] };
const LINE2 = 'Films on set. Software on screen.';
function drawBack(W, H) {
  const [c, g] = makeCanvas(W, H);
  const phone = W < 700, G = phone ? 18 : 32;
  g.fillStyle = C.pink; g.fillRect(0, 0, W, H);
  const lines = phone ? ROLE.phone : ROLE.wide;
  g.font = `900 100px ${DISPLAY}`;
  const wid = l => { const m = g.measureText(l); return m.actualBoundingBoxRight + m.actualBoundingBoxLeft; };
  const asc = g.measureText('d').actualBoundingBoxAscent / 100, desc = g.measureText('p').actualBoundingBoxDescent / 100;
  /* on a phone the role is drawn tall, like the name, so both faces carry the same weight */
  const STEP = 0.96, SY = phone ? 1.85 : 1;
  let size = (W - 2 * G) / Math.max(...lines.map(wid)) * 100;
  const blockOf = s => s * SY * (asc + (lines.length - 1) * STEP + desc);
  const room = H - (phone ? 230 : 190);
  if (blockOf(size) > room) size *= room / blockOf(size);
  const top = H * (phone ? 0.46 : 0.47) - blockOf(size) / 2;
  g.font = `900 ${size}px ${DISPLAY}`; g.fillStyle = C.cobalt; g.textBaseline = 'alphabetic';
  lines.forEach((l, i) => {
    const m = g.measureText(l);
    g.save(); g.translate(G + m.actualBoundingBoxLeft, top + size * SY * (asc + i * STEP)); g.scale(1, SY); g.fillText(l, 0, 0); g.restore();
  });

  /* the second line, small, bottom right, clear of the Scroll prompt */
  g.font = `800 ${phone ? 14 : 16}px "Bricolage Grotesque", system-ui, sans-serif`; g.fillStyle = C.ink; g.textAlign = 'right';
  g.fillText(LINE2, W - G, H - (phone ? 26 : 30));
  g.textAlign = 'left';
  return c;
}

/* ---------- three ---------- */
let renderer = null, scene, camera, amb, key;
let W = 0, H = 0, N = 0, pitch = 0, mesh = null, wallBack = null, frontTex = null, backTex = null;
let ang, off, vel, slatX, rmBack = null, rmFront = null, blueAttr = null;
const dummy = new THREE.Object3D();

function patch(mat, sign, uniforms, tag) {
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, uniforms);
    sh.vertexShader = 'attribute float aCol;\nattribute float aBlue;\nvarying float vBlue;\nuniform float uPitch, uN, uH;\n' + sh.vertexShader.replace('#include <uv_vertex>',
      `#include <uv_vertex>
      vBlue = aBlue;
      #ifdef USE_MAP
      vMapUv = vec2((aCol + 0.5 + ${sign.toFixed(1)} * position.x / uPitch) / uN, position.y / uH + 0.5);
      #endif`);
    /* the front of a slat that has gone past the pink face prints plain light blue instead of the name */
    if (sign > 0) sh.fragmentShader = 'varying float vBlue;\nuniform vec3 uBlueCol;\n' + sh.fragmentShader.replace('#include <map_fragment>',
      `#include <map_fragment>
      if (vBlue > 0.5) diffuseColor.rgb = uBlueCol;`);
  };
  mat.customProgramCacheKey = () => tag;   /* front and back must not share a program */
}

function initGL() {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(DPR);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(C.navy);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(16, 1, 1, 20000);
  /* soft studio light: a key from high left and an even fill, tuned so a slat facing you prints its true colour */
  amb = new THREE.AmbientLight(0xffffff, 1.32);
  key = new THREE.DirectionalLight(0xffffff, 2.05);
  key.castShadow = true;
  scene.add(amb, key, key.target);
}

function build() {
  W = innerWidth; H = stageEl.clientHeight || innerHeight;
  heroEl.style.height = Math.round((1 + HAND[0]) * H) + 'px';
  if (RM) { buildFlat(); return; }
  const phone = W < 700;
  N = phone ? Math.max(28, Math.round(W / 12)) : Math.min(200, Math.max(120, Math.round(W / 10)));
  pitch = W / N;
  renderer.setSize(W, H, false);

  if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); mesh.material.forEach(m => m.dispose()); }
  if (wallBack) { scene.remove(wallBack); wallBack.geometry.dispose(); wallBack.material.dispose(); }
  frontTex && frontTex.dispose(); backTex && backTex.dispose();

  const aniso = renderer.capabilities.getMaxAnisotropy();
  frontTex = new THREE.CanvasTexture(drawFront(W, H)); backTex = new THREE.CanvasTexture(drawBack(W, H));
  for (const t of [frontTex, backTex]) { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = aniso; }

  const slatW = pitch - Math.max(0.35, pitch * 0.022), depth = pitch * 0.2;
  const geo = new THREE.BoxGeometry(slatW, H, depth);
  const cols = new Float32Array(N); for (let i = 0; i < N; i++) cols[i] = i;
  geo.setAttribute('aCol', new THREE.InstancedBufferAttribute(cols, 1));
  blueAttr = new THREE.InstancedBufferAttribute(new Float32Array(N), 1); blueAttr.setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('aBlue', blueAttr);
  const uni = { uPitch: { value: pitch }, uN: { value: N }, uH: { value: H }, uBlueCol: { value: new THREE.Color(C.blue) } };
  const side = new THREE.MeshLambertMaterial({ color: C.paper });
  const front = new THREE.MeshLambertMaterial({ map: frontTex });
  const back = new THREE.MeshLambertMaterial({ map: backTex });
  patch(front, 1, uni, 'slat-front'); patch(back, -1, uni, 'slat-back');
  /* box groups: +x, -x, +y, -y, +z (front), -z (back) */
  mesh = new THREE.InstancedMesh(geo, [side, side, side, side, front, back], N);
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false;
  scene.add(mesh);

  /* the sky blue wall the slats hang in front of: in the gaps it reads as soft shadow */
  wallBack = new THREE.Mesh(new THREE.PlaneGeometry(W * 1.6, H * 1.6), new THREE.MeshLambertMaterial({ color: C.sky }));
  wallBack.position.z = -depth / 2 - pitch * 0.9; wallBack.receiveShadow = true;
  scene.add(wallBack);

  ang = new Float32Array(N); off = new Float32Array(N); vel = new Float32Array(N); slatX = new Float32Array(N);
  for (let i = 0; i < N; i++) slatX[i] = (i + 0.5) * pitch;

  /* camera fitted so the front plane of the wall fills the viewport exactly */
  camera.aspect = W / H;
  const dist = (H / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) + depth / 2;
  camera.position.set(0, 0, dist); camera.near = dist * 0.5; camera.far = dist * 2; camera.updateProjectionMatrix();

  const L = Math.max(W, H);
  key.position.set(-0.5 * L, 0.42 * L, 1.15 * L); key.target.position.set(0, 0, 0);
  const sc = key.shadow.camera; sc.left = -W * 0.75; sc.right = W * 0.75; sc.top = H * 0.75; sc.bottom = -H * 0.75; sc.near = 1; sc.far = L * 3;
  sc.updateProjectionMatrix();
  key.shadow.mapSize.set(phone ? 1024 : 2048, 2048);
  key.shadow.map && (key.shadow.map.dispose(), key.shadow.map = null);
  key.shadow.bias = -0.0004; key.shadow.normalBias = pitch * 0.06; key.shadow.radius = 3;
}

/* reduced motion: no wall, no wave. The name sits still and scrolling crossfades it to the role */
function buildFlat() {
  stageEl.querySelectorAll('.rm-face').forEach(e => e.remove());
  canvas.style.display = 'none';
  const f = drawFront(W, H), b = drawBack(W, H);
  f.className = b.className = 'rm-face'; f.setAttribute('aria-hidden', 'true'); b.setAttribute('aria-hidden', 'true');
  b.style.opacity = 0; b.style.transition = 'opacity .48s cubic-bezier(.7,0,.2,1)';
  stageEl.insertBefore(f, $('scrollcue')); stageEl.insertBefore(b, $('scrollcue'));
  rmBack = b; rmFront = f;
}

function place() {
  for (let i = 0; i < N; i++) {
    dummy.position.set(slatX[i] - W / 2, 0, 0);
    dummy.rotation.set(0, ang[i], 0);
    dummy.updateMatrix(); mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
}

/* ---------- input: the wave follows the pointer; touch gets a light wave until the page takes the gesture as a scroll ---------- */
const P = { x: null, inside: false, woke: false, startX: null, moved: -1e9 };
canvas.addEventListener('pointermove', e => {
  P.x = e.clientX; P.inside = true; P.moved = performance.now() / 1000;
  if (P.startX === null) P.startX = e.clientX;
  if (Math.abs(e.clientX - P.startX) > 60) P.woke = true;
});
canvas.addEventListener('pointerdown', e => { P.x = e.clientX; P.inside = true; if (e.pointerType !== 'mouse') P.woke = true; });
const out = e => { if (!e || e.pointerType !== 'mouse') P.inside = false; };
addEventListener('pointerup', out);
canvas.addEventListener('pointercancel', () => { P.inside = false; });
canvas.addEventListener('pointerleave', () => { P.inside = false; });
document.addEventListener('mouseleave', () => { P.inside = false; });
addEventListener('blur', () => { P.inside = false; });

/* ---------- scroll: the push and the hand-off follow the raw scroll so they stay locked to #numbers ---------- */
let gone = false, sm = null;
const cue = $('kpcue');
/* clicking the prompt scrolls to the end of the turn, so the wall plays its full cascade */
cue.addEventListener('click', () => scrollTo({ top: Math.round((FLIP[1] + 0.06) * H), behavior: RM ? 'auto' : 'smooth' }));
function onScroll() {
  const s = scrollY / H;
  if (s > 0.02) P.woke = true;
  const p = rng(s, HAND[0], HAND[1]);
  /* no push: by the hand-off the wall is flat light blue, the same ground #numbers rises on */
  gone = p >= 1;
  stageEl.classList.toggle('kp-gone', gone);
  document.body.classList.toggle('kp-going', s > HAND[0] - 0.04);
  document.body.classList.toggle('past', s > HAND[0] + 0.5);
  const midA = (FLIP[0] + FLIP[1]) / 2, midB = (FLIP2[0] + FLIP2[1]) / 2;
  if (RM && rmBack) { rmBack.style.opacity = s > midA && s < midB ? 1 : 0; rmFront.style.opacity = s > midA ? 0 : 1; }
  /* the prompt fades out over the first stretch of the turn */
  const cf = 1 - rng(s, 0.03, 0.16);
  cue.style.opacity = cf.toFixed(3); cue.classList.toggle('kp-off', cf < 0.2);
  /* the page ground under the stage follows the face, so a collapsing phone toolbar never shows a blue band under the pink */
  document.body.style.backgroundColor = s > midA && s < midB ? C.pink : '';
}
let scrollT = -1e9;   /* last scroll time: the hover wave sleeps while the page is scrolling */
addEventListener('scroll', () => { scrollT = performance.now() / 1000; }, { passive: true });
addEventListener('scroll', onScroll, { passive: true });

/* ---------- motion ---------- */
const PI = Math.PI;
/* the hand wave is quick with a small overshoot, as in the sketch */
const SP = { k: 120, z: 0.52 };
const now = () => performance.now() / 1000;
let last = now(), t0 = now(), frames = 0, settled = false, dirty = true, drawnSm = -1;

function step() {
  requestAnimationFrame(step);
  const t = now(), dt = Math.min(1 / 30, t - last); last = t;
  const s = scrollY / H;
  if (sm === null) sm = s;
  /* the turn follows a smoothed scroll, so a wheel notch reads as one stroke, not a stutter */
  sm += (s - sm) * (1 - Math.exp(-dt * 7));
  if (Math.abs(s - sm) < 1e-4) sm = s;
  /* once the wall is all light blue the slats dissolve into the flat blue stage behind them: same colour, no step */
  const fade = rng(sm, FADE[0], FADE[1]);
  canvas.style.opacity = fade > 0 ? (1 - fade).toFixed(3) : '';
  if (gone || fade >= 1) { settled = true; dirty = true; return; }

  const u = rng(sm, FLIP[0], FLIP[1]), u2 = rng(sm, FLIP2[0], FLIP2[1]);
  const R = W < 700 ? W * 0.17 : Math.max(110, W * 0.085);
  const idle = !P.woke && !P.inside && u === 0;
  const ix = (((t - t0) % 6.5) / 4.6) * (W * 1.4) - W * 0.2;   /* a slow swell crossing the wall, then a rest: says it moves */
  /* the wave answers movement: a pointer resting on the wall lets it close again, so the face you scrolled to reads whole */
  const rest = 1 - smooth(0.8, 1.6, t - P.moved);
  /* no reveal while scrolling: the wave fades out on scroll and eases back in once the page and the turn have settled */
  const calm = Math.abs(s - sm) > 2e-3 ? 0 : smooth(0.25, 0.65, t - scrollT);
  const c = 2 * SP.z * Math.sqrt(SP.k), sub = 3, h = dt / sub;
  let vmax = 0;
  for (let i = 0; i < N; i++) {
    const x = slatX[i], xi = x / W;
    /* the cascade: each slat turns on the move curve, starting a little after the one to its left */
    const t1 = PI * eMove(clamp(u * (1 + SPREAD) - xi * SPREAD));
    /* the second cascade: the same curve and stagger, pink over to plain light blue */
    const t2 = PI * eMove(clamp(u2 * (1 + SPREAD) - xi * SPREAD));
    const base = t1 + t2;
    blueAttr.array[i] = t2 > 0.001 ? 1 : 0;   /* swapped while the front faces away, so the swap never shows */
    let f = 0;
    if (P.inside && P.x !== null) f = rest * calm * (1 - smooth(R * 0.32, R, Math.abs(x - P.x)));
    /* on either face, the wave turns a slat toward the other one */
    let target = u2 > 0 ? f * (PI - 2 * t2) : f * (PI - 2 * t1);
    if (idle) target = Math.max(target, 0.2 * Math.exp(-(((x - ix) / (W * 0.08)) ** 2)));
    let a = off[i], v = vel[i];
    for (let k = 0; k < sub; k++) { v += (-SP.k * (a - target) - c * v) * h; a += v * h; }
    off[i] = a; vel[i] = v; vmax = Math.max(vmax, Math.abs(v), Math.abs(a - target));
    ang[i] = base + a;
  }
  /* nothing moved: skip the draw, so the numbers chapter has the GPU to itself during the hand-off */
  if (dirty || idle || vmax > 1e-4 || sm !== drawnSm) {
    blueAttr.needsUpdate = true;
    place(); renderer.render(scene, camera); frames++;
    dirty = false; drawnSm = sm;
  }
  settled = Math.abs(s - sm) < 1e-4 && vmax < 0.01 && !idle;
}

/* test hooks for the headless check */
window.SLATS = { get frames() { return frames; }, get settled() { return settled; }, get N() { return N; }, get sm() { return sm; }, state: P, wake() { P.woke = true; } };

let rz = 0, builtW = 0;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (Math.abs(innerWidth - builtW) > 2 || Math.abs(stageEl.clientHeight - H) > 2) { builtW = innerWidth; build(); onScroll(); dirty = true; } }, 150); });

await Promise.all([document.fonts.load(`900 100px ${DISPLAY}`), document.fonts.load('800 16px "Bricolage Grotesque"'), document.fonts.load('500 15px "Bricolage Grotesque"')]);
if (!RM) initGL();
builtW = innerWidth;
build();
onScroll();
document.body.classList.add('kp-in');
if (!RM) requestAnimationFrame(step); else settled = true;
window.SLATS.ready = true;
</script>

  <section id="work" aria-label="Work"></section>

<div id="kc" aria-hidden="true" hidden><div class="kr"><i></i><b></b></div><div class="kd"><i></i></div></div>
<script>
/* the cursor. One rAF loop that sleeps when nothing moves; it only ever writes transforms. */
(() => {
  const fine = matchMedia('(hover: hover) and (pointer: fine)'), calm = matchMedia('(prefers-reduced-motion: reduce)');
  return;   /* custom cursor switched off: Kirtan disliked it (code kept for reference) */
  const root = document.documentElement, kc = document.getElementById('kc');
  const dot = kc.querySelector('.kd'), ring = kc.querySelector('.kr'), word = ring.querySelector('b');
  root.classList.add('has-cursor'); kc.hidden = false; kc.classList.add('off');
  const K = 520, C = 2 * Math.sqrt(K);   /* critically damped: it catches up without overshoot */
  let px = -100, py = -100, rx = -100, ry = -100, vx = 0, vy = 0, last = 0, raf = 0, seen = false, sampleAt = 0, lastEl = null;
  const lum = c => { const m = c.match(/[\d.]+/g); if (!m || (m[3] !== undefined && +m[3] < .5)) return -1; return (0.2126 * m[0] + 0.7152 * m[1] + 0.0722 * m[2]) / 255; };
  function read(el) {
    /* what sits under the pointer: a label, a plain link, a text field, and how dark the ground is */
    const field = el && el.closest('input,textarea,select,[contenteditable="true"]');
    const lab = el && el.closest('[data-cursor]');
    const link = el && el.closest('a[href],button,[role="button"],label,summary');
    let dark = false;
    for (let n = el; n && n.nodeType === 1; n = n.parentElement) {
      if (n === kc) continue;
      const L = lum(getComputedStyle(n).backgroundColor);
      if (L >= 0) { dark = L < 0.4; break; }
    }
    kc.classList.toggle('dark', dark);
    kc.classList.toggle('field', !!field);
    const text = lab && lab.getAttribute('data-cursor').trim();
    if (text) word.textContent = text;
    kc.classList.toggle('lab', !!text && !field);
    kc.classList.toggle('link', !text && !!link && !field);
    kc.classList.toggle('off', !!field || !seen);
  }
  function sample(t) {
    if (t - sampleAt < 90) return;
    sampleAt = t;
    const el = document.elementFromPoint(px, py);
    if (el !== lastEl) read(el);
    lastEl = el;
  }
  function frame(t) {
    raf = 0;
    const dt = Math.min(1 / 30, last ? (t - last) / 1000 : 1 / 60); last = t;
    for (let i = 0, h = dt / 2; i < 2; i++) { vx += (-K * (rx - px) - C * vx) * h; vy += (-K * (ry - py) - C * vy) * h; rx += vx * h; ry += vy * h; }
    dot.style.transform = `translate3d(${px}px,${py}px,0)`;
    ring.style.transform = `translate3d(${rx.toFixed(2)}px,${ry.toFixed(2)}px,0)`;
    sample(t);
    if (lastEl === null && seen) raf = requestAnimationFrame(frame);
    else if (Math.abs(rx - px) + Math.abs(ry - py) + Math.abs(vx) + Math.abs(vy) > 0.05) raf = requestAnimationFrame(frame);
    else { rx = px; ry = py; vx = vy = 0; last = 0; ring.style.transform = `translate3d(${px}px,${py}px,0)`; }
  }
  const wake = () => { if (!raf) raf = requestAnimationFrame(frame); };
  addEventListener('pointermove', e => {
    if (e.pointerType && e.pointerType !== 'mouse' && e.pointerType !== 'pen') return;
    px = e.clientX; py = e.clientY;
    if (!seen) { seen = true; rx = px; ry = py; sampleAt = 0; lastEl = null; read(document.elementFromPoint(px, py)); }
    wake();
  }, { passive: true });
  /* the ground can change under a still pointer: scroll and page changes re-read it */
  const reread = () => { if (seen) { lastEl = null; wake(); } };   /* the frame's sampler does the read, at most every 90ms */
  addEventListener('scroll', reread, { passive: true, capture: true });
  addEventListener('hashchange', () => setTimeout(reread, 60));
  addEventListener('pointerdown', () => kc.classList.add('down'));
  addEventListener('pointerup', () => kc.classList.remove('down'));
  document.addEventListener('mouseleave', () => { seen = false; kc.classList.add('off'); kc.classList.remove('down'); });
  document.addEventListener('mouseenter', () => { /* the next move places it */ });
  addEventListener('blur', () => { seen = false; kc.classList.add('off'); });
  /* a switch to touch or to reduced motion hands the system cursor back */
  const drop = () => { if (!fine.matches || calm.matches) { root.classList.remove('has-cursor'); kc.hidden = true; } else { root.classList.add('has-cursor'); kc.hidden = false; } };
  fine.addEventListener && fine.addEventListener('change', drop); calm.addEventListener && calm.addEventListener('change', drop);
  window.KC = { get state() { return { px, py, rx, ry, cls: kc.className }; } };
})();
</script>

<script type="module">
/* Smooth scroll for the whole page: Lenis 1.1.13, on a fine pointer only (touch keeps native scrolling), driven by the
   one GSAP ticker that the work section also renders from (Lenis first, then everything else, in the same frame).
   It smooths the wheel from #work down. Above that the slats and the numbers already follow the raw scroll through
   their own smoothing (about 0.12 per frame, tuned to the shapes), and a second smoothing on top of theirs doubled
   the lag, so there Lenis lets the native wheel through and their settled frames are exactly as before.
   kp:pause fires on window with { detail: { paused } } when #work covers the screen (the stages behind are hidden). */
import gsap from 'gsap';
import { ScrollTrigger } from 'gsap/ScrollTrigger';
import Lenis from 'lenis';
gsap.registerPlugin(ScrollTrigger);
const KP = (window.KP ||= {});
KP.gsap = gsap; KP.ScrollTrigger = ScrollTrigger;
const work = document.getElementById('work');
const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (fine && !calm) {
  let lenis = null;
  /* smooth from half a screen above #work; once a smooth glide is running it finishes, so it never fights the native one */
  const inWork = () => work.getBoundingClientRect().top < innerHeight * 0.5;
  lenis = new Lenis({ lerp: 0.12, wheelMultiplier: 1, smoothWheel: true, syncTouch: false,
    virtualScroll: () => inWork() || lenis.isScrolling === 'smooth',
    prevent: (n) => n.id === 'ct-panel' || n.classList.contains('ct-panel') });
  lenis.on('scroll', ScrollTrigger.update);
  gsap.ticker.add((t) => lenis.raf(t * 1000));
  gsap.ticker.lagSmoothing(0);
  KP.lenis = lenis;
}
/* a line across the top edge: #work is under it exactly while #work covers the screen */
new IntersectionObserver(([e]) => {
  const on = e.isIntersecting;
  if (document.body.classList.contains('kp-work') === on) return;
  document.body.classList.toggle('kp-work', on);
  dispatchEvent(new CustomEvent('kp:pause', { detail: { paused: on } }));
}, { rootMargin: '0px 0px -100% 0px' }).observe(work);
dispatchEvent(new Event('kp:smooth'));
</script>
