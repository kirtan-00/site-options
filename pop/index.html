<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Kirtan Purohit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1d3bff; --red:#ff2e1f; --yellow:#ffd400; --lime:#b8ff2b; --pink:#ff5c8a; --ink:#121416; --paper:#f3f6f7; --line:#d6dde0;
  --disp:"Anton","Impact",sans-serif; --body:"Archivo",system-ui,sans-serif; --mono:"Martian Mono",ui-monospace,monospace;
  --acc:var(--blue);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--blue);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase}

/* ---------- landing ---------- */
#landing{position:fixed;inset:0;background:var(--blue);overflow:hidden;touch-action:none}
#blobs{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero{position:absolute;left:clamp(20px,4vw,64px);top:clamp(18px,4vh,56px);z-index:2;pointer-events:none}
.hero h1{margin:0;font:400 clamp(84px,17vw,300px)/.84 var(--disp);color:#fff;text-transform:none;letter-spacing:-.005em}
.hero h1 .w{display:block;white-space:nowrap}
.hero h1 .w:nth-child(2){margin-left:-.02em}
.hero .l{display:inline-block;pointer-events:auto;cursor:default;transition:transform .55s var(--ease),color .2s;will-change:transform}
.hero .l.pop{transform:translateY(-.09em) rotate(var(--r,0deg)) scale(1.06);transition:transform .12s ease-out,color .05s}
.hero p{margin:clamp(14px,2.2vh,26px) 0 0;color:#fff;line-height:1.7;max-width:34ch}
.go{position:absolute;z-index:3;left:clamp(20px,4vw,64px);bottom:max(clamp(20px,4.5vh,52px),env(safe-area-inset-bottom));display:flex;gap:12px;flex-wrap:wrap}
.tabbtn{height:58px;padding:0 26px;border-radius:29px;background:#fff;color:var(--ink);font:400 26px/1 var(--disp);letter-spacing:.01em;display:inline-flex;align-items:center;gap:12px;transition:transform .35s var(--ease),background .2s,color .2s}
.tabbtn i{width:12px;height:12px;border-radius:50%;background:var(--c);transition:transform .35s var(--ease)}
.tabbtn:hover{transform:translateY(-4px) rotate(-2deg);background:var(--c);color:var(--ink)}
.tabbtn:hover i{background:var(--ink);transform:scale(1.5)}
.tabbtn:active{transform:scale(.95)}
.hint{position:absolute;z-index:2;right:clamp(20px,4vw,64px);bottom:max(clamp(26px,5vh,60px),env(safe-area-inset-bottom));color:#fff;text-align:right;pointer-events:none}

/* ---------- wipe ---------- */
#wipe{position:fixed;z-index:30;left:0;top:0;width:10px;height:10px;border-radius:50%;background:var(--paper);transform:translate(-50%,-50%) scale(0);pointer-events:none;will-change:transform}

/* ---------- work ---------- */
#work{position:fixed;inset:0;z-index:10;background:var(--paper);overflow-y:auto;overflow-x:hidden;visibility:hidden;opacity:0;-webkit-overflow-scrolling:touch}
#work.on{visibility:visible;opacity:1}
.wtop{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px clamp(18px,4vw,64px);background:rgba(243,246,247,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.home{font:400 26px/1 var(--disp);display:inline-flex;align-items:center;gap:10px}
.home i{width:16px;height:16px;border-radius:50%;background:var(--blue);transition:transform .4s var(--ease)}
.home:hover i{transform:scale(1.6)}
.tabs{position:relative;display:flex;background:#fff;border-radius:28px;padding:5px;box-shadow:0 0 0 1px var(--line)}
.tabs button{position:relative;z-index:1;height:44px;padding:0 24px;border-radius:22px;font:400 21px/1 var(--disp);letter-spacing:.01em;transition:color .25s}
.tabs button.on{color:#fff}
.tabs .ind{position:absolute;z-index:0;top:5px;left:5px;height:44px;border-radius:22px;background:var(--acc);transition:transform .5s var(--ease),width .5s var(--ease),background .3s}
.count{color:#5b666b}
.whead{padding:clamp(26px,5vw,70px) clamp(18px,4vw,64px) clamp(18px,3vw,40px);display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.whead h2{margin:0;font:400 clamp(64px,13vw,220px)/.84 var(--disp)}
.whead h2 .l{display:inline-block;transition:transform .5s var(--ease),color .2s}
.whead p{margin:0 0 8px;max-width:30ch;line-height:1.7;color:#3d474c}
.grid{padding:0 clamp(18px,4vw,64px) 90px;display:flex;flex-direction:column;gap:clamp(14px,1.6vw,26px)}
.row{display:flex;gap:clamp(14px,1.6vw,26px)}
.card{flex:1 1 0;min-width:0;text-align:left;display:block;transition:flex-grow .55s var(--ease)}
.row:hover .card{flex-grow:.82}
.row .card:hover{flex-grow:1.5}
.card .m{position:relative;height:clamp(220px,27vw,430px);border-radius:24px;overflow:hidden;background:var(--c,#dfe5e8);transform:translateZ(0)}
.card .m img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.card:hover .m img{transform:scale(1.05)}
.card .m .big{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;font:400 clamp(40px,6vw,96px)/.9 var(--disp);color:var(--ink)}
.card .m .big img{position:static;width:auto;height:auto;max-width:58%;max-height:46%;object-fit:contain}
.card .dot{position:absolute;left:16px;top:16px;width:44px;height:44px;border-radius:50%;background:var(--acc);display:grid;place-items:center;color:#fff;font:400 20px/1 var(--disp);transform:scale(0);transition:transform .45s var(--ease)}
.card:hover .dot{transform:scale(1)}
.card h3{margin:16px 0 4px;font:400 clamp(30px,3.3vw,54px)/.95 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card h3 .l{display:inline-block;transition:color .15s}
.card p{margin:0;color:#4a555a;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:52ch}

/* ---------- project page: calm, frosted glass ---------- */
#proj{position:fixed;inset:0;z-index:20;visibility:hidden;opacity:0;transition:opacity .25s;overflow-y:auto;background:var(--ink)}
#proj.on{visibility:visible;opacity:1}
#pbg{position:fixed;inset:-60px;background-size:cover;background-position:center;filter:blur(38px) saturate(1.15);transform:scale(1.1);opacity:.9;pointer-events:none}
#pbg::after{content:"";position:absolute;inset:0;background:rgba(18,20,22,.28)}
.pin{position:relative;max-width:1320px;margin:0 auto;padding:22px clamp(16px,3.2vw,44px) 60px;color:#fff}
.glass{background:rgba(255,255,255,.14);backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);border-radius:24px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),inset 0 1px 0 rgba(255,255,255,.45)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(40,46,50,.86)}}
.pbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.gbtn{height:46px;padding:0 20px;border-radius:23px;font:500 14px/1 var(--body);display:inline-flex;align-items:center;gap:8px;transition:background .2s,transform .2s}
.gbtn:hover{background:rgba(255,255,255,.28)}
.gbtn:active{transform:scale(.96)}
.ptitle{margin:0 0 20px;font:400 clamp(60px,11vw,180px)/.86 var(--disp);text-shadow:0 2px 40px rgba(0,0,0,.25)}
.ptabs{display:inline-flex;padding:5px;border-radius:28px;margin-bottom:18px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{height:42px;padding:0 20px;border-radius:21px;font:500 14px/1 var(--body);white-space:nowrap;transition:background .2s,color .2s}
.ptabs button.on{background:#fff;color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.tile{padding:22px;grid-column:span 4;min-height:120px}
.tile.w6{grid-column:span 6}.tile.w8{grid-column:span 8}.tile.w12{grid-column:span 12}.tile.w3{grid-column:span 3}
.tile small{display:block;margin-bottom:10px;opacity:.8}
.tile .v{font:500 clamp(17px,1.5vw,21px)/1.35 var(--body)}
.tile .n{font:400 clamp(40px,4.4vw,68px)/1 var(--disp)}
.tile .lead{font:500 clamp(20px,2.1vw,30px)/1.3 var(--body);letter-spacing:-.01em}
.tile p{margin:0 0 14px;font-size:17px;line-height:1.6}.tile p:last-child{margin:0}
.tile.img{padding:0;overflow:hidden;min-height:0;aspect-ratio:16/10;cursor:zoom-in;transition:transform .3s var(--ease),box-shadow .3s}
.tile.img.tall{aspect-ratio:9/16}
.tile.img:hover{transform:translateY(-4px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),0 18px 40px rgba(0,0,0,.25)}
.tile.img img,.tile.img video{width:100%;height:100%;object-fit:cover;display:block}
.tile.img .play{position:absolute;left:14px;bottom:14px;height:34px;padding:0 12px;border-radius:17px;background:rgba(18,20,22,.7);display:flex;align-items:center}
.tile.img{position:relative}
.tile.logo{display:grid;place-items:center;background:rgba(255,255,255,.86)}
.tile.logo img{max-width:60%;max-height:120px;object-fit:contain}
.tile a.big{font:400 clamp(26px,2.6vw,40px)/1 var(--disp);text-decoration:none;display:inline-flex;gap:10px;align-items:center}
.tile a.big:hover{text-decoration:underline;text-underline-offset:6px}
.pnav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
.pnav .gbtn{height:62px;border-radius:31px;padding:0 26px;font:400 24px/1 var(--disp)}
#lb{position:fixed;inset:0;z-index:40;background:rgba(10,12,13,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:none;place-items:center;padding:4vmin;cursor:zoom-out}
#lb.on{display:grid}
#lb img,#lb video{max-width:100%;max-height:92vh;border-radius:18px;display:block}

@media (max-width:820px){
  .hero h1{font-size:clamp(84px,27vw,190px)}
  .tabbtn{height:52px;font-size:22px;padding:0 20px}
  .hint{display:none}
  .wtop{padding:12px 16px;flex-wrap:wrap}
  .count{display:none}
  .tabs button{height:40px;padding:0 18px;font-size:19px}.tabs .ind{height:40px}
  .whead{display:block;padding:26px 16px 18px}.whead p{margin-top:14px}
  .grid{padding:0 16px 70px;gap:26px}.row{flex-direction:column;gap:26px}
  .row:hover .card,.row .card:hover{flex-grow:1}
  .card .m{height:62vw;border-radius:18px}
  .card h3{white-space:normal}
  .tile,.tile.w6,.tile.w8,.tile.w3{grid-column:span 12}
  .tile.img.half{grid-column:span 6}
  .pnav .gbtn{font-size:19px;height:54px;padding:0 18px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>

<section id="landing">
  <canvas id="blobs"></canvas>
  <div class="hero">
    <h1 id="name" aria-label="Kirtan Purohit"></h1>
    <p class="mono">Creative producer, filmmaker and developer.<br>Based in Ahmedabad, working everywhere.</p>
  </div>
  <div class="go">
    <button class="tabbtn" data-go="software" style="--c:var(--lime)"><i></i>Software</button>
    <button class="tabbtn" data-go="media" style="--c:var(--yellow)"><i></i>Media</button>
  </div>
  <div class="hint mono">Push things around.<br>Then pick a side.</div>
</section>

<div id="wipe"></div>

<section id="work" aria-hidden="true">
  <div class="wtop">
    <button class="home" id="home"><i></i>Kirtan Purohit</button>
    <div class="tabs" id="tabs"><span class="ind"></span><button data-tab="software">Software</button><button data-tab="media">Media</button></div>
    <span class="count mono" id="count"></span>
  </div>
  <div class="whead"><h2 id="wtitle"></h2><p class="mono" id="wsub"></p></div>
  <div class="grid" id="grid"></div>
</section>

<section id="proj" aria-hidden="true">
  <div id="pbg"></div>
  <div class="pin">
    <div class="pbar"><button class="gbtn glass" id="pback">← All projects</button><span class="mono" id="pwhere"></span></div>
    <h2 class="ptitle" id="ptitle"></h2>
    <div class="ptabs glass" id="ptabs"></div>
    <div class="tiles" id="tiles"></div>
    <div class="pnav"><button class="gbtn glass" id="pprev"></button><button class="gbtn glass" id="pnext"></button></div>
  </div>
</section>
<div id="lb"></div>

<script>
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const POP=['#ffd400','#b8ff2b','#ff5c8a','#ff2e1f','#ffffff'], INK='#121416';
const TAB={software:{acc:'#1d3bff',title:'Software',sub:'Things I designed and built. Hover a card, click to open it.'},
           media:{acc:'#ff2e1f',title:'Media',sub:'Films and reels I produced, shot and cut. Hover a card, click to open it.'}};
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
const C='../content/';
let DATA={software:[],media:[]}, tab='software', cur=null, viewed=new Set();

/* ---------- letters that pop ---------- */
function letters(node,text,cols){
  node.innerHTML='';
  text.split(' ').forEach((w,wi,arr)=>{const ws=el('span','w');
    [...w].forEach(ch=>{const s=el('span','l');s.textContent=ch;s.setAttribute('aria-hidden','true');
      s.addEventListener('pointerenter',()=>{s.style.color=cols[Math.floor(Math.random()*cols.length)];s.style.setProperty('--r',(Math.random()*10-5).toFixed(1)+'deg');s.classList.add('pop');
        clearTimeout(s._t);s._t=setTimeout(()=>s.classList.remove('pop'),140)});
      ws.appendChild(s)});
    node.appendChild(ws); if(node.dataset.inline&&wi<arr.length-1) node.appendChild(document.createTextNode(' '))});
}
letters($('#name'),'Kirtan Purohit',POP.slice(0,4));

/* ---------- blobs: soft-body feeling circles you can shove and throw ---------- */
const cv=$('#blobs'), cx=cv.getContext('2d'); let W=0,H=0,DPR=1, B=[], M={x:-9e3,y:-9e3,px:0,py:0,vx:0,vy:0,down:false,grab:null}, running=true;
function seed(){
  const phone=innerWidth<820, n=phone?9:15; B=[];
  const big=Math.min(W,H);
  const spec=[[.34,INK],[.2,INK],[.11,'#ffd400'],[.08,'#b8ff2b'],[.07,'#ff5c8a'],[.05,INK],[.045,'#ff2e1f'],[.04,INK],[.035,'#ffffff'],[.03,INK],[.03,'#ffd400'],[.026,INK],[.024,'#b8ff2b'],[.02,INK],[.02,'#ff5c8a']].slice(0,n);
  spec.forEach(([k,c],i)=>{const r=big*k*(phone?.8:1);B.push({x:W*(.55+.5*Math.sin(i*2.4))*.9+W*.05,y:H*(.5+.42*Math.cos(i*1.7)),vx:0,vy:0,r,c,m:r*r,sq:0,sa:0})});
  B[0].x=W*.72;B[0].y=H*.34; if(B[1]){B[1].x=W*.98;B[1].y=H*.78}
}
function size(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);if(!B.length)seed()}
function step(dt){
  const t=performance.now()/1000;
  for(const b of B){
    if(M.grab===b){const k=.28;b.vx=(M.x-b.x)*k/dt*.016;b.vy=(M.y-b.y)*k/dt*.016}
    else{
      const dx=b.x-M.x,dy=b.y-M.y,d=Math.hypot(dx,dy)||1,reach=b.r+90;
      if(d<reach){const f=(reach-d)/reach;b.vx+=dx/d*f*1.4+M.vx*.05*f;b.vy+=dy/d*f*1.4+M.vy*.05*f}
      b.vx+=Math.sin(t*.4+b.r)*.006;b.vy+=Math.cos(t*.33+b.r*.7)*.006;
    }
    b.vx*=.985;b.vy*=.985;b.x+=b.vx;b.y+=b.vy;
    const e=.72,o=b.r*.35;
    if(b.x<b.r-o){b.x=b.r-o;b.vx=Math.abs(b.vx)*e;b.sq=1}if(b.x>W-b.r+o){b.x=W-b.r+o;b.vx=-Math.abs(b.vx)*e;b.sq=1}
    if(b.y<b.r-o){b.y=b.r-o;b.vy=Math.abs(b.vy)*e;b.sq=1}if(b.y>H-b.r+o){b.y=H-b.r+o;b.vy=-Math.abs(b.vy)*e;b.sq=1}
    b.sq*=.9;
  }
  for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++){const a=B[i],b=B[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,min=a.r+b.r;
    if(d<min){const nx=dx/d,ny=dy/d,ov=min-d,ta=b.m/(a.m+b.m),tb=a.m/(a.m+b.m);a.x-=nx*ov*ta;a.y-=ny*ov*ta;b.x+=nx*ov*tb;b.y+=ny*ov*tb;
      const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const jn=-(1.6)*rv/(1/a.m+1/b.m);a.vx-=jn*nx/a.m;a.vy-=jn*ny/a.m;b.vx+=jn*nx/b.m;b.vy+=jn*ny/b.m;a.sq=b.sq=Math.min(1,Math.abs(rv)*.25)}}}
}
function draw(){
  cx.clearRect(0,0,W,H);
  for(const b of B){const sp=Math.hypot(b.vx,b.vy),st=Math.min(.22,sp*.012)+b.sq*.06,ang=Math.atan2(b.vy,b.vx);
    cx.save();cx.translate(b.x,b.y);cx.rotate(ang);cx.scale(1+st,1-st*.8);cx.beginPath();cx.arc(0,0,b.r,0,6.2832);cx.fillStyle=b.c;cx.fill();cx.restore()}
}
let lt=0;function loop(t){requestAnimationFrame(loop);if(!running)return;const dt=Math.min(.033,(t-lt)/1000||.016);lt=t;if(!reduced)step(dt);draw();M.vx*=.8;M.vy*=.8}
const L=$('#landing');
L.addEventListener('pointermove',e=>{M.vx=e.clientX-M.x;M.vy=e.clientY-M.y;if(Math.abs(M.vx)>300)M.vx=0;if(Math.abs(M.vy)>300)M.vy=0;M.x=e.clientX;M.y=e.clientY});
L.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;M.x=e.clientX;M.y=e.clientY;let hit=null;for(const b of B)if(Math.hypot(b.x-M.x,b.y-M.y)<b.r)hit=b;M.grab=hit;if(hit)L.setPointerCapture(e.pointerId)});
const rel=()=>{M.grab=null};L.addEventListener('pointerup',rel);L.addEventListener('pointercancel',rel);
L.addEventListener('pointerleave',()=>{if(!M.grab){M.x=-9e3;M.y=-9e3}});
addEventListener('resize',()=>{const ow=W,oh=H;size();for(const b of B){b.x*=W/ow;b.y*=H/oh}});

/* ---------- circle wipe between views ---------- */
function wipe(x,y,color,mid){
  const w=$('#wipe'),R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y))/5+2;
  w.style.left=x+'px';w.style.top=y+'px';w.style.background=color;
  if(reduced){mid();return}
  w.style.transition='none';w.style.transform='translate(-50%,-50%) scale(0)';w.getBoundingClientRect();
  w.style.transition='transform .62s cubic-bezier(.7,0,.2,1)';w.style.transform=`translate(-50%,-50%) scale(${R})`;
  setTimeout(()=>{mid();w.style.transition='opacity .3s';w.style.opacity=0;setTimeout(()=>{w.style.transition='none';w.style.transform='translate(-50%,-50%) scale(0)';w.style.opacity=1},320)},600);
}

/* ---------- work grid ---------- */
function setTab(t,instant){
  tab=t;const T=TAB[t];document.documentElement.style.setProperty('--acc',T.acc);
  document.querySelectorAll('#tabs button').forEach(b=>{const on=b.dataset.tab===t;b.classList.toggle('on',on);
    if(on){const i=$('#tabs .ind');i.style.width=b.offsetWidth+'px';i.style.transform=`translateX(${b.offsetLeft-5}px)`}});
  const h=$('#wtitle');h.dataset.inline='1';letters(h,T.title,[T.acc,'#ffd400','#ff5c8a','#b8ff2b']);
  $('#wsub').textContent=T.sub;
  const g=$('#grid');g.innerHTML='';const list=DATA[t],per=innerWidth<820?1:(list.length%3===1&&list.length>3?3:3);
  const tints=['#ffd400','#b8ff2b','#ff5c8a','#cfe0ff','#ffd9d4'];
  let row;list.forEach((p,i)=>{
    if(i%per===0){row=el('div','row');g.appendChild(row)}
    const c=el('button','card');c.style.setProperty('--c',tints[i%tints.length]);
    const m=el('div','m');
    if(p.hero){const im=el('img');im.src=C+p.hero;im.alt=p.name;im.loading='lazy';m.appendChild(im)}
    else{const b=el('div','big');const lg=p.logo_ink||p.logo;if(lg){const im=el('img');im.src=C+lg;im.alt=p.name;b.appendChild(im)}else b.textContent=p.name;m.appendChild(b)}
    m.appendChild(el('span','dot','→'));
    const h3=el('h3');h3.dataset.inline='1';h3.textContent=p.name;
    c.append(m,h3,el('p',null,p.one_line));
    c.addEventListener('click',e=>openProj(p,e));
    row.appendChild(c);
  });
  if(row&&per===3){const miss=(3-row.children.length)%3;for(let k=0;k<miss;k++){const s=el('div','card');s.style.visibility='hidden';row.appendChild(s)}}
  updCount(); if(!instant)$('#work').scrollTo({top:0,behavior:reduced?'auto':'smooth'});
}
function updCount(){const n=DATA.software.length+DATA.media.length;$('#count').textContent=String(viewed.size).padStart(2,'0')+' / '+String(n).padStart(2,'0')+' viewed'}
function showWork(t,x,y){
  wipe(x,y,'#f3f6f7',()=>{$('#work').classList.add('on');$('#work').setAttribute('aria-hidden','false');running=false;setTab(t,true);$('#work').scrollTop=0});
}
function showHome(e){
  const r=e.currentTarget.getBoundingClientRect();
  wipe(r.left+12,r.top+r.height/2,'#1d3bff',()=>{$('#work').classList.remove('on');$('#work').setAttribute('aria-hidden','true');running=true});
}
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',e=>{const r=b.getBoundingClientRect();showWork(b.dataset.go,r.left+r.width/2,r.top+r.height/2)}));
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
$('#home').addEventListener('click',showHome);

/* ---------- project page (still, frosted) ---------- */
function media(p){const a=[];if(p.video)a.push({v:p.video,poster:p.hero});if(p.hero)a.push({i:p.hero});(p.gallery||[]).forEach(g=>a.push({i:g}));return a}
function openProj(p,e){
  cur=p;viewed.add(p.id);updCount();
  const all=[...DATA.software,...DATA.media],ix=all.indexOf(p),prev=all[(ix-1+all.length)%all.length],next=all[(ix+1)%all.length];
  $('#pbg').style.backgroundImage=p.hero?`url("${C+p.hero}")`:'none';
  $('#proj').style.background=p.hero?INK:(p.wing==='media'?'#7a1a14':'#122a8c');
  $('#ptitle').textContent=p.name;$('#pwhere').textContent=(p.wing==='media'?'Media':'Software')+' · '+String(ix+1).padStart(2,'0')+' of '+all.length;
  const med=media(p),tall=p.orientation==='vertical'||p.orientation==='portrait';
  const names=['Overview'];if(med.length)names.push(p.wing==='media'?'Reels':'Screens');names.push('Details');
  const pt=$('#ptabs');pt.innerHTML='';names.forEach((n,i)=>{const b=el('button',i?'':'on',n);b.addEventListener('click',()=>{pt.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));render(n)});pt.appendChild(b)});
  function tile(cls,html){const t=el('div','tile glass '+cls,html);$('#tiles').appendChild(t);return t}
  function mtile(m,cls){const t=tile('img '+(tall?'tall w3 half ':'')+cls,'');
    if(m.v){const v=el('video');v.src=C+m.v;v.muted=true;v.loop=true;v.playsInline=true;v.preload='metadata';if(m.poster)v.poster=C+m.poster;t.appendChild(v);t.appendChild(el('span','play mono','Play'));
      t.addEventListener('pointerenter',()=>v.play().catch(()=>{}));t.addEventListener('pointerleave',()=>v.pause())}
    else{const im=el('img');im.src=C+m.i;im.loading='lazy';im.alt=p.name;t.appendChild(im)}
    t.addEventListener('click',()=>lightbox(m));return t}
  function render(n){
    const T=$('#tiles');T.innerHTML='';
    if(n==='Overview'){
      tile('w8',`<small class="mono">What it is</small><div class="lead"></div>`).querySelector('.lead').textContent=p.one_line;
      if(med.length) mtile(med[0],tall?'':'w4'); else if(p.logo||p.logo_ink){const t=tile('logo','');const im=el('img');im.src=C+(p.logo_ink||p.logo);im.alt=p.name;t.appendChild(im)}
      (p.facts||[]).forEach(f=>{const short=String(f.value).length<=8;const t=tile(short?'w3':'',`<small class="mono"></small><div class="${short?'n':'v'}"></div>`);t.querySelector('small').textContent=f.label;t.lastChild.textContent=f.value});
      if(p.link){const t=tile('w6',`<small class="mono">Live</small>`);const a=el('a','big');a.href=p.link;a.target='_blank';a.rel='noopener';a.textContent=p.link.replace(/^https?:\/\//,'').replace(/\/$/,'')+' ↗';t.appendChild(a)}
    }else if(n==='Details'){
      (p.writeup||[]).forEach(w=>{const t=tile('w6','<p></p>');t.querySelector('p').textContent=w});
      if(p.screens_withheld) tile('w6',`<small class="mono">Screens</small><div class="v">This one runs on real data, so there are no screenshots here.</div>`);
    }else{ med.forEach(m=>mtile(m,tall?'':'')) }
    $('#proj').scrollTop=0;
  }
  render('Overview');
  $('#pprev').textContent='← '+prev.name;$('#pnext').textContent=next.name+' →';
  $('#pprev').onclick=()=>swap(prev);$('#pnext').onclick=()=>swap(next);
  const P=$('#proj');if(e){const x=e.clientX||innerWidth/2,y=e.clientY||innerHeight/2;wipe(x,y,TAB[p.wing]?.acc||INK,()=>{P.classList.add('on');P.setAttribute('aria-hidden','false')})}else{P.classList.add('on')}
}
function swap(p){const P=$('#proj');P.classList.remove('on');setTimeout(()=>openProj(p,null),reduced?0:200)}
function closeProj(){$('#proj').classList.remove('on');$('#proj').setAttribute('aria-hidden','true');cur=null}
$('#pback').addEventListener('click',closeProj);
function lightbox(m){const b=$('#lb');b.innerHTML='';if(m.v){const v=el('video');v.src=C+m.v;v.controls=true;v.autoplay=true;v.loop=true;v.playsInline=true;v.muted=true;b.appendChild(v)}else{const i=el('img');i.src=C+m.i;b.appendChild(i)}b.classList.add('on')}
$('#lb').addEventListener('click',e=>{if(e.target.tagName!=='VIDEO'){$('#lb').classList.remove('on');$('#lb').innerHTML=''}});
addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('#lb').classList.contains('on')){$('#lb').classList.remove('on');$('#lb').innerHTML=''}else if(cur)closeProj()});

/* ---------- boot ---------- */
(async function(){
  size();requestAnimationFrame(loop);
  for(const w of ['software','media']){try{DATA[w]=await (await fetch(C+w+'/manifest.json')).json()}catch(e){DATA[w]=[]}}
  if(document.fonts&&document.fonts.ready)await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]);
  window.__ready=true;window.__s={B,DATA,viewed};
})();
</script>
